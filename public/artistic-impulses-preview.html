<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sakuraverse — 1:1 Authentic Artistic Impulses Preview</title>
  
  <!-- Exo 2 Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

  <!-- Three.js r128 CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050106;
      font-family: 'Exo 2', sans-serif;
      color: #ffffff;
      touch-action: none;
    }

    #scene-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      transition: transform 0.08s ease-out;
      transform-origin: center center;
    }

    canvas#webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    canvas#drawing-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 2;
      pointer-events: auto;
      cursor: crosshair;
    }

    /* Top HUD Header */
    .top-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      background: linear-gradient(180deg, rgba(5, 1, 6, 0.85) 0%, rgba(5, 1, 6, 0) 100%);
      pointer-events: none;
    }

    .brand-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff80df, #ffffff, #00f0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .telemetry-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      color: rgba(255, 255, 255, 0.85);
      pointer-events: auto;
    }

    /* Status Banner */
    #info-banner {
      position: absolute;
      top: 76px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 20px;
      background: rgba(15, 7, 24, 0.75);
      border: 1px solid rgba(255, 128, 223, 0.25);
      border-radius: 9999px;
      backdrop-filter: blur(16px);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: #fdf2f8;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
      pointer-events: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      max-width: 90%;
      text-align: center;
    }

    #status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff2a9d;
      box-shadow: 0 0 10px #ff2a9d;
      animation: pulse-dot 2s infinite ease-in-out;
      flex-shrink: 0;
    }

    @keyframes pulse-dot {
      0%, 100% { transform: scale(1.0); opacity: 0.7; }
      50% { transform: scale(1.4); opacity: 1.0; }
    }

    /* Blossom Palette Reveal Bar (Impuls 2) */
    #color-palette-bar {
      position: absolute;
      bottom: 175px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 18px;
      background: rgba(18, 10, 28, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 9999px;
      backdrop-filter: blur(14px);
      z-index: 12;
      pointer-events: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    #color-palette-bar.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .palette-circle {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 0 12px currentColor;
      transition: transform 0.2s ease;
      cursor: pointer;
    }

    .palette-circle:hover {
      transform: scale(1.25);
    }

    /* Drawing Hint Overlay */
    #drawing-hint {
      position: absolute;
      top: 125px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 16px;
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 9999px;
      backdrop-filter: blur(8px);
      font-size: 11px;
      font-weight: 600;
      color: #7dd3fc;
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 10;
      pointer-events: none;
    }

    /* Bottom Control Dock */
    .control-dock {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 36px);
      max-width: 1080px;
      background: rgba(12, 6, 20, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(24px);
      border-radius: 20px;
      padding: 16px 20px;
      z-index: 15;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.65), 0 0 1px rgba(255, 255, 255, 0.2);
    }

    .dock-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
    }

    .dock-header strong {
      color: #ff80df;
      font-weight: 700;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    .impulse-btn {
      position: relative;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      color: #ffffff;
      outline: none;
      font-family: 'Exo 2', sans-serif;
      text-align: left;
    }

    .impulse-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 128, 223, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255, 42, 157, 0.18);
    }

    .impulse-btn:active {
      transform: translateY(0);
    }

    .impulse-btn.active {
      background: linear-gradient(135deg, rgba(255, 42, 157, 0.28) 0%, rgba(217, 70, 239, 0.18) 100%);
      border-color: #ff80df;
      box-shadow: 0 0 20px rgba(255, 42, 157, 0.35);
    }

    .btn-badge {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #ff80df;
    }

    .btn-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #ffffff;
    }

    .btn-duration {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 400;
    }

    .impulse-btn.plexus-btn {
      border-color: rgba(0, 240, 255, 0.25);
    }

    .impulse-btn.plexus-btn:hover {
      border-color: #00f0ff;
      box-shadow: 0 6px 16px rgba(0, 240, 255, 0.22);
    }

    .impulse-btn.plexus-btn.active {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.26) 0%, rgba(56, 189, 248, 0.15) 100%);
      border-color: #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.38);
    }

    .impulse-btn.sequence-btn {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
      border-color: rgba(255, 255, 255, 0.22);
    }

    @media (max-width: 768px) {
      .button-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .control-dock {
        padding: 12px;
        bottom: 10px;
      }
      #color-palette-bar {
        bottom: 250px;
      }
    }
  </style>
</head>
<body>

  <!-- Viewport Container for Scene Zoom / Scaling -->
  <div id="scene-container">
    <canvas id="webgl-canvas"></canvas>

  <!-- Header -->
  <header class="top-header">
    <div class="brand-badge">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff2a9d" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3c1.5 2.5 1.5 5 0 7-1.5-2-1.5-4.5 0-7zm6 3c.5 3-1 5-3 5.5 1-2.5 1-4.5 3-5.5zM6 6c2 1 2 3 3 5.5-2-.5-3.5-2.5-3-5.5zm11 9c-1 2.5-3 3-5.5 3 2-1 3-2.5 5.5-3zm-10 0c2.5.5 3.5 2 5.5 3-2.5 0-4.5-.5-5.5-3z" />

    <div class="palette-circle" style="background: #ef4444;" title="Crimson Red"></div>

  <!-- Bottom Control Dock with Trigger Buttons -->
  <div class="control-dock">

  <script>
    // =========================================================================
    // 1. EXACT SHADERS FROM SakuraCanvas.tsx
    // =========================================================================

    const bgVertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `;

    const bgFragmentShader = `
      precision highp float;
      uniform vec3 iResolution;
      uniform float iTime;
      uniform sampler2D iChannel0;
      uniform float uKaleidoscope;
      uniform float uGridVibe;
      uniform float uRippleActive;
      uniform float uRippleTime;
      uniform vec3 uBgColor1;
      uniform vec3 uBgColor2;
      uniform vec3 uBgColor3;
      uniform vec3 uRippleCrest;
      uniform float uBgBlend;
      uniform float uBgDim;
      varying vec2 vUv;

      float noise(in vec2 x) {
        vec2 p = floor(x);
        vec2 f = fract(x);
        f = f * f * (3.0 - 2.0 * f);
        float a = texture2D(iChannel0, (p + vec2(0.5, 0.5)) / 256.0).x;
        float b = texture2D(iChannel0, (p + vec2(1.5, 0.5)) / 256.0).x;
        float c = texture2D(iChannel0, (p + vec2(0.5, 1.5)) / 256.0).x;
        float d = texture2D(iChannel0, (p + vec2(1.5, 1.5)) / 256.0).x;
        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
      }

      const mat2 mtx = mat2(0.80, 0.60, -0.60, 0.80);

      float fbm(vec2 p) {
        float f = 0.0;
        f += 0.500000 * noise(p); p = mtx * p * 2.02;
        f += 0.250000 * noise(p); p = mtx * p * 2.03;
        f += 0.125000 * noise(p); p = mtx * p * 2.01;
        f += 0.062500 * noise(p); p = mtx * p * 2.04;
        f += 0.031250 * noise(p); p = mtx * p * 2.01;
        f += 0.015625 * noise(p);
        return f / 0.96875;
      }

      float pattern(in vec2 p, in float t, in vec2 uv) {
        vec2 q = vec2(fbm(p), fbm(p + vec2(10.0, 1.3)));
        vec2 r = vec2(fbm(p + 4.0 * q + vec2(t) + vec2(1.7, 9.2)), fbm(p + 4.0 * q + vec2(t) + vec2(8.3, 2.8)));
        vec2 g = vec2(fbm(p + 2.0 * r + vec2(t * 20.0) + vec2(2.0, 6.0)), fbm(p + 2.0 * r + vec2(t * 10.0) + vec2(5.0, 3.0)));
        return fbm(p + 5.5 * g + vec2(-t * 7.0));
      }

      void main() {
        vec2 fragCoord = gl_FragCoord.xy;
        vec2 uv = clamp(fragCoord / max(iResolution.xy, vec2(1.0)), 0.0, 1.0);
        
        vec2 rippleOffset = vec2(0.0);
        float waveNormal = 0.0;
        float waveFade = 0.0;
        float insideWave = 0.0;

        if (uRippleActive > 0.5) {
          vec2 centerUv = uv - vec2(0.5);
          centerUv.x *= iResolution.x / iResolution.y;
          float dist = length(centerUv);

          float waveRadius = (uRippleTime / 3.0) * 1.8;
          float waveDist = abs(dist - waveRadius);

          float wavePhase = waveDist * 32.0 - uRippleTime * 9.0;
          waveNormal = cos(wavePhase) * exp(-waveDist * waveDist * 110.0);
          waveFade = smoothstep(3.0, 2.2, uRippleTime) * smoothstep(0.0, 0.1, uRippleTime);

          insideWave = smoothstep(waveRadius + 0.15, waveRadius - 0.15, dist) * waveFade;
          rippleOffset = normalize(centerUv + vec2(0.0001)) * waveNormal * 0.045 * waveFade;
        }

        vec2 distortedFragCoord = fragCoord + rippleOffset * iResolution.xy;
        vec2 distortedUv = clamp(uv + rippleOffset, 0.0, 1.0);

        if (uKaleidoscope > 0.001) {
          vec2 p = distortedUv - vec2(0.5);
          float r = length(p);
          float a = atan(p.y, p.x);
          float sides = 6.0;
          float tau = 6.2831853;
          a = mod(a, tau / sides);
          a = abs(a - tau / (2.0 * sides));
          vec2 kUV = vec2(cos(a), sin(a)) * r + vec2(0.5);
          distortedUv = mix(distortedUv, kUV, uKaleidoscope);
        }

        float noiseVal = pattern(distortedFragCoord * vec2(0.004), iTime * 0.007, distortedUv);
        
        float effectiveBlend = clamp(max(uBgBlend, insideWave), 0.0, 1.0);
        vec3 baseC1 = mix(vec3(0.05, 0.00, 0.02), uBgColor1, effectiveBlend);
        vec3 baseC2 = mix(vec3(0.74, 0.00, 0.36), uBgColor2, effectiveBlend);
        vec3 baseC3 = mix(vec3(0.80, 0.04, 0.44), uBgColor3, effectiveBlend);

        vec3 col = mix(baseC1, baseC2, smoothstep(0.0, 1.0, noiseVal));
        col = mix(col, baseC1 * 2.2, noiseVal * 0.8);
        col = mix(col, baseC3, 0.35 * noiseVal);
        col = mix(col, baseC2 * 0.7, smoothstep(0.0, 0.6, 0.6 * noiseVal));
        col = mix(col, baseC3 * 1.1, 0.12 * noiseVal);
        
        col *= noiseVal * 1.68;

        if (uKaleidoscope > 0.001) {
          vec3 colKaleido = mix(baseC3, vec3(1.0), 0.3) * (0.8 + 0.5 * sin(iTime * 1.5 + noiseVal * 6.28));
          col = mix(col, col * 1.35 + colKaleido * 0.4, uKaleidoscope * 0.7);
        }

        if (uRippleActive > 0.5) {
          col += uRippleCrest * waveNormal * waveFade * 0.65;
        }

        float vignetteVal = max(0.0, 70.0 * uv.x * uv.y * (1.0 - uv.x) * (1.0 - uv.y));
        col *= (0.80 * (0.70 + 0.65 * sqrt(vignetteVal))) * uBgDim;
        col *= 0.90;
        
        gl_FragColor = vec4(col, 1.0);
      }
    `;

    // 1:1 Sumi-E Branch Shaders
    const sumiVertexShader = `
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vViewPosition;

      void main() {
        vUv = uv;
        vNormal = normalize(normalMatrix * normal);
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vViewPosition = -mvPosition.xyz;
        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    const sumiFragmentShader = `
      precision highp float;
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vViewPosition;

      uniform vec3 uColor;
      uniform float uTotalLength;
      uniform float uProgress;
      uniform float uTime;
      uniform float uAlpha;

      vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec3 permute(vec3 x) { return mod289(((x * 34.0) + 1.0) * x); }

      float snoise(vec2 v) {
        const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
        vec2 i = floor(v + dot(v, C.yy));
        vec2 x0 = v - i + dot(i, C.xx);
        vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
        vec4 x12 = x0.xyxy + C.xxzz;
        x12.xy -= i1;
        i = mod289(i);
        vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
        vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
        m = m * m; m = m * m;
        vec3 x = 2.0 * fract(p * C.www) - 1.0;
        vec3 h = abs(x) - 0.5;
        vec3 ox = floor(x + 0.5);
        vec3 a0 = x - ox;
        m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
        vec3 g;
        g.x = a0.x * x0.x + h.x * x0.y;
        g.yz = a0.yz * x12.xz + h.yz * x12.yw;
        return 130.0 * dot(m, g);
      }

      void main() {
        float currentMaxDist = uTotalLength * uProgress;
        float currentDist = vUv.y;
        if (currentDist > currentMaxDist) discard;

        float tipDist = currentMaxDist - currentDist;
        float tipErosion = smoothstep(0.0, 0.35, tipDist);
        float edgeDist = abs(vUv.x - 0.5) * 2.0;

        float noiseVal = snoise(vec2(vUv.x * 7.0, vUv.y * 3.5));
        float noiseVal2 = snoise(vec2(vUv.x * 14.0 + 3.1, vUv.y * 8.0));
        float combinedNoise = noiseVal * 0.65 + noiseVal2 * 0.35;

        float raggedEdge = smoothstep(0.95 + combinedNoise * 0.22, 0.35, edgeDist);
        float alpha = raggedEdge * tipErosion * uAlpha;
        if (alpha < 0.015) discard;

        vec3 inkBase = uColor;
        vec3 inkDeep = inkBase * 0.55;
        vec3 inkHighlight = mix(inkBase, vec3(1.0, 0.98, 0.94), 0.45);

        float centerVein = 1.0 - smoothstep(0.0, 0.45, edgeDist);
        vec3 finalColor = mix(inkDeep, inkBase, raggedEdge);
        finalColor = mix(finalColor, inkHighlight, centerVein * 0.35);

        vec3 N = normalize(vNormal);
        vec3 L = normalize(vec3(0.5, 0.8, 1.0));
        float diffuse = max(dot(N, L), 0.0);
        finalColor += inkHighlight * diffuse * 0.22;

        gl_FragColor = vec4(finalColor, alpha);
      }
    `;

    // 1:1 SakuraCanvas OrbNode Shaders (Sumi-E Style)
    const orbMeshVertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const sakuraOrbFragmentShader = `
      varying vec2 vUv;
      uniform float uAlpha;
      uniform float uTime;
      uniform vec3 uColor;

      void main() {
        vec2 p = vUv - vec2(0.5);
        float r = length(p);
        if (r > 0.5) discard;

        float core = exp(-r * r * 45.0);
        float glow = exp(-r * 7.5) * 0.75;
        float pulse = 0.88 + 0.12 * sin(uTime * 5.0);
        float intensity = (core * 1.6 + glow) * pulse;

        vec3 col = mix(uColor, vec3(1.0, 0.95, 0.98), core * 0.75);
        float alpha = intensity * uAlpha * smoothstep(0.5, 0.22, r);

        if (alpha < 0.005) discard;
        gl_FragColor = vec4(col, alpha);
      }
    `;

    const ringFragmentShader = `
      varying vec2 vUv;
      uniform float uAlpha;
      uniform float uTime;

      void main() {
        vec2 p = vUv - vec2(0.5);
        float r = length(p);
        float uRadius = 0.38;
        float dist = abs(r - uRadius);
        
        float thinRing = smoothstep(0.018, 0.0, dist);
        float specularGlow = exp(-dist * dist * 900.0);
        float softHalo = exp(-dist * 35.0) * 0.25;
        float totalIntensity = (thinRing * 1.8 + specularGlow * 1.4 + softHalo) * smoothstep(0.50, 0.20, r);

        if (totalIntensity < 0.005) discard;
        float pulse = 0.85 + 0.15 * sin(uTime * 6.0);
        vec3 shinyCore = vec3(0.90, 0.97, 1.0);
        vec3 cyanElectric = vec3(1.0, 0.45, 0.85);
        vec3 finalCol = mix(cyanElectric, shinyCore, specularGlow * 0.85);

        gl_FragColor = vec4(finalCol, totalIntensity * uAlpha * pulse * 0.98);
      }
    `;

    // 1:1 Volumetric Raymarching Fractal Orb Shaders (Plexus)
    const fractalOrbVertexShader = `
      varying vec3 vLocalPosition;
      varying vec3 vNormal;
      varying vec3 vViewPosition;

      void main() {
        vLocalPosition = position;
        vNormal = normalize(normalMatrix * normal);
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vec4 mvCenter = modelViewMatrix * vec4(0.0, 0.0, 0.0, 1.0);
        vViewPosition = vec3(mvCenter.xy - mvPosition.xy, -mvPosition.z);
        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    const fractalOrbFragmentShader = `
      precision highp float;
      varying vec3 vLocalPosition;
      varying vec3 vNormal;
      varying vec3 vViewPosition;

      uniform float uTime;
      uniform float uMorph;
      uniform float uComplexity;
      uniform float uColorShift;
      uniform float uPulse;
      uniform float uGlowIntensity;
      uniform float uAlpha;
      uniform vec3 uColorA;
      uniform vec3 uColorB;
      uniform vec3 uColorCore;

      float fractalSDF(vec3 p) {
        vec3 z = p;
        float dr = 1.0;
        float r = 0.0;
        float power = 3.0 + uComplexity * 4.0;
        float morphPhase = sin(uTime * 0.4) * 0.2 + uMorph * 0.4;
        
        for (int i = 0; i < 12; i++) {
          r = length(z);
          if (r > 2.0) break;
          float theta = acos(z.z / (r + 0.0001)) + morphPhase;
          float phi = atan(z.y, z.x) + uTime * 0.08;
          dr = pow(r, power - 1.0) * power * dr + 1.0;
          float zr = pow(r, power);
          theta = theta * power;
          phi = phi * power;
          z = zr * vec3(sin(theta) * cos(phi), sin(phi) * sin(theta), cos(theta));
          z += p;
        }
        return 0.5 * log(r) * r / dr;
      }

      vec3 calcNormal(vec3 p) {
        const float eps = 0.004;
        return normalize(vec3(
          fractalSDF(vec3(p.x + eps, p.y, p.z)) - fractalSDF(vec3(p.x - eps, p.y, p.z)),
          fractalSDF(vec3(p.x, p.y + eps, p.z)) - fractalSDF(vec3(p.x, p.y - eps, p.z)),
          fractalSDF(vec3(p.x, p.y, p.z + eps)) - fractalSDF(vec3(p.x, p.y, p.z - eps))
        ));
      }

      void main() {
        vec3 ro = -vViewPosition;
        vec3 rd = normalize(vLocalPosition - ro);
        float t = 0.0;
        float maxDist = 3.0;
        float hitDist = -1.0;
        int hitSteps = 0;

        for (int i = 0; i < 64; i++) {
          vec3 p = ro + rd * t;
          float d = fractalSDF(p);
          if (d < 0.003) {
            hitDist = t;
            hitSteps = i;
            break;
          }
          t += max(d * 0.7, 0.005);
          if (t > maxDist) break;
        }

        if (hitDist > 0.0) {
          vec3 hitP = ro + rd * hitDist;
          vec3 N = calcNormal(hitP);
          vec3 L = normalize(vec3(1.0, 1.5, 2.0));
          float diff = max(dot(N, L), 0.0);
          float fresnel = pow(1.0 - max(dot(-rd, N), 0.0), 3.0);
          float stepGlow = float(hitSteps) / 64.0;

          vec3 baseCol = mix(uColorA, uColorB, sin(hitP.z * 3.0 + uColorShift * 6.28) * 0.5 + 0.5);
          vec3 finalCol = mix(baseCol, uColorCore, diff * 0.6);
          finalCol += uColorB * fresnel * 1.5;
          finalCol += uColorCore * stepGlow * 0.8;

          float pulseGlow = (0.9 + 0.1 * sin(uTime * 4.0)) * uPulse;
          finalCol *= pulseGlow * uGlowIntensity;

          gl_FragColor = vec4(finalCol, uAlpha);
        } else {
          float rimGlow = pow(1.0 - max(dot(-rd, vNormal), 0.0), 4.0) * 0.5;
          vec3 rimCol = mix(uColorA, uColorB, 0.5) * rimGlow * uGlowIntensity * uPulse;
          gl_FragColor = vec4(rimCol, rimGlow * uAlpha * 0.4);
        }
      }
    `;

    const atmosphereFragmentShader = `
      varying vec3 vNormal;
      varying vec3 vViewPosition;

      uniform float uTime;
      uniform float uPulse;
      uniform float uGlowIntensity;
      uniform vec3 uColorA;
      uniform vec3 uColorB;
      uniform float uAlpha;

      void main() {
        vec3 N = normalize(vNormal);
        vec3 V = normalize(vViewPosition);
        float rim = 1.0 - max(dot(V, N), 0.0);
        float corona = pow(rim, 2.8) * 1.6;
        float pulse = 0.85 + 0.15 * sin(uTime * 3.2);

        vec3 col = mix(uColorA, uColorB, rim) * corona * pulse * uGlowIntensity;
        float alpha = corona * 0.7 * uAlpha;
        if (alpha < 0.005) discard;
        gl_FragColor = vec4(col, alpha);
      }
    `;

    // =========================================================================
    // 2. SCENE INITIALIZATION & CAMERA (EXACT LEFT-ANCHOR AS SAKURACANVAS)
    // =========================================================================

    const webglCanvas = document.getElementById('webgl-canvas');
    const drawingCanvas = document.getElementById('drawing-canvas');
    const drawingCtx = drawingCanvas.getContext('2d');
    const sceneContainer = document.getElementById('scene-container');
    const telemetryMode = document.getElementById('telemetry-mode');
    const telemetryTimer = document.getElementById('telemetry-timer');
    const infoText = document.getElementById('info-text');
    const colorPaletteBar = document.getElementById('color-palette-bar');
    const drawingHint = document.getElementById('drawing-hint');

    let width = window.innerWidth;
    let height = window.innerHeight;

    const renderer = new THREE.WebGLRenderer({
      canvas: webglCanvas,
      antialias: true,
      powerPreference: 'high-performance',
      alpha: false
    });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.autoClear = false;

    // Background Scene
    const bgScene = new THREE.Scene();
    const bgCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    function createNoiseTexture() {
      const size = 256;
      const data = new Uint8Array(size * size * 4);
      for (let i = 0; i < size * size; i++) {
        const val = Math.floor(Math.random() * 256);
        data[i * 4] = val;
        data[i * 4 + 1] = val;
        data[i * 4 + 2] = val;
        data[i * 4 + 3] = 255;
      }
      const texture = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.needsUpdate = true;
      return texture;
    }
    const noiseTex = createNoiseTexture();

    const bgUniforms = {
      iResolution: { value: new THREE.Vector3(renderer.domElement.width, renderer.domElement.height, 1) },
      iTime: { value: 0 },
      iChannel0: { value: noiseTex },
      uKaleidoscope: { value: 0.0 },
      uGridVibe: { value: 0.0 },
      uRippleActive: { value: 0.0 },
      uRippleTime: { value: 0.0 },
      uBgColor1: { value: new THREE.Vector3(0.05, 0.00, 0.02) },
      uBgColor2: { value: new THREE.Vector3(0.74, 0.00, 0.36) },
      uBgColor3: { value: new THREE.Vector3(0.80, 0.04, 0.44) },
      uRippleCrest: { value: new THREE.Vector3(1.0, 0.4, 0.8) },
      uBgBlend: { value: 0.0 },
      uBgDim: { value: 1.0 }
    };

    const bgMat = new THREE.ShaderMaterial({
      vertexShader: bgVertexShader,
      fragmentShader: bgFragmentShader,
      uniforms: bgUniforms,
      depthWrite: false,
      depthTest: false
    });
    bgScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat));

    // Main 3D Scene
    const mainScene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);

    const baseCamPos = new THREE.Vector3();
    const baseLookAt = new THREE.Vector3();
    let currentZoomMultiplier = 1.0;
    let targetZoomMultiplier = 1.0;

    function updateCamera() {
      const aspect = width / height;
      camera.aspect = aspect;
      camera.fov = 45 / currentZoomMultiplier;
      camera.updateProjectionMatrix();

      // Exact Left Anchor formula from SakuraCanvas.tsx
      const visibleWidth = 2 * Math.tan(THREE.MathUtils.degToRad(22.5)) * 16 * aspect;
      const targetCamX = -9.6 + (visibleWidth * 0.48);

      baseCamPos.set(targetCamX, -0.4, 16);
      baseLookAt.set(targetCamX, -0.4, 0);

      camera.position.copy(baseCamPos);
      camera.lookAt(baseLookAt);
    }

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      renderer.setSize(width, height);
      drawingCanvas.width = width;
      drawingCanvas.height = height;
      bgUniforms.iResolution.value.set(renderer.domElement.width, renderer.domElement.height, 1);
      updateCamera();
    }
    window.addEventListener('resize', resizeCanvas);
    drawingCanvas.width = width;
    drawingCanvas.height = height;

    // =========================================================================
    // 3. SEPARATE ROOT GROUPS (BRANCH VS ORBS)
    // =========================================================================

    const branchGroup = new THREE.Group();
    const orbsGroup = new THREE.Group();
    mainScene.add(branchGroup);
    mainScene.add(orbsGroup);

    // Initial state: Both hidden until an impulse is selected
    branchGroup.visible = false;
    orbsGroup.visible = false;

    // =========================================================================
    // 4. SUMI-E 3D CATMULL-ROM RIBBON MESH GENERATION (LEFT-ALIGNED)
    // =========================================================================

    class SumiStrokeMesh {
      constructor(colorHex = 0xf5e4cf, baseWidth = 0.52) {
        this.baseWidth = baseWidth;
        this.maxPoints = 400;
        this.pointCount = 0;
        this.pathLength = 0;
        this.points = [];
        this.positions = new Float32Array(this.maxPoints * 2 * 3);
        this.uvs = new Float32Array(this.maxPoints * 2 * 2);
        this.indices = new Uint16Array(this.maxPoints * 6);

        this.geometry = new THREE.BufferGeometry();
        this.geometry.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));
        this.geometry.setAttribute('uv', new THREE.BufferAttribute(this.uvs, 2));
        this.geometry.setIndex(new THREE.BufferAttribute(this.indices, 1));

        this.uniforms = {
          uColor: { value: new THREE.Color(colorHex) },
          uTotalLength: { value: 0.0 },
          uProgress: { value: 1.0 },
          uTime: { value: 0.0 },
          uAlpha: { value: 1.0 }
        };

        this.material = new THREE.ShaderMaterial({
          vertexShader: sumiVertexShader,
          fragmentShader: sumiFragmentShader,
          uniforms: this.uniforms,
          transparent: true,
          side: THREE.DoubleSide,
          depthWrite: false
        });

        this.mesh = new THREE.Mesh(this.geometry, this.material);
        branchGroup.add(this.mesh);
      }

      addPoint(p, widthScale = 1.0) {
        if (this.pointCount >= this.maxPoints - 1) return;
        let dir = new THREE.Vector3(0, 1, 0);
        let dist = 0.5;

        if (this.pointCount > 0) {
          const lastP = this.points[this.pointCount - 1];
          dir.subVectors(p, lastP);
          dist = dir.length();
          if (dist < 0.02) return;
          dir.normalize();
        }

        this.points.push(p.clone());
        this.pathLength += dist * 0.5;

        const up = new THREE.Vector3(0, 0, 1);
        let normal = new THREE.Vector3().crossVectors(dir, up).normalize();
        if (normal.lengthSq() < 0.001) normal.set(1, 0, 0);

        const w = this.baseWidth * widthScale;
        const left = p.clone().add(normal.clone().multiplyScalar(w * 0.5));
        const right = p.clone().sub(normal.clone().multiplyScalar(w * 0.5));

        const i = this.pointCount * 6;
        this.positions[i] = left.x;
        this.positions[i + 1] = left.y;
        this.positions[i + 2] = left.z;
        this.positions[i + 3] = right.x;
        this.positions[i + 4] = right.y;
        this.positions[i + 5] = right.z;

        const u = this.pointCount * 4;
        this.uvs[u] = 0;
        this.uvs[u + 1] = this.pathLength;
        this.uvs[u + 2] = 1;
        this.uvs[u + 3] = this.pathLength;

        if (this.pointCount > 0) {
          const idx = (this.pointCount - 1) * 6;
          const vIdx = (this.pointCount - 1) * 2;
          this.indices[idx] = vIdx;
          this.indices[idx + 1] = vIdx + 1;
          this.indices[idx + 2] = vIdx + 2;
          this.indices[idx + 3] = vIdx + 1;
          this.indices[idx + 4] = vIdx + 3;
          this.indices[idx + 5] = vIdx + 2;
        }

        this.pointCount++;
        this.uniforms.uTotalLength.value = this.pathLength;
        this.geometry.setDrawRange(0, Math.max(0, (this.pointCount - 1) * 6));
        this.geometry.attributes.position.needsUpdate = true;
        this.geometry.attributes.uv.needsUpdate = true;
        if (this.geometry.index) this.geometry.index.needsUpdate = true;
      }
    }

    let mainTrunkStroke = new SumiStrokeMesh(0xf5e4cf, 0.62);
    let branchStroke1 = new SumiStrokeMesh(0xf5e4cf, 0.42);
    let branchStroke2 = new SumiStrokeMesh(0xf5e4cf, 0.38);

    // Exact Trunk Curve starting at bottom-left edge (startX = -11.9, y = -3.4)
    const startX = -11.9;
    const trunkCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(startX, -3.4, 0.0),
      new THREE.Vector3(startX + 2.5, -2.2, 0.25),
      new THREE.Vector3(-5.4, -2.7, -0.20),
      new THREE.Vector3(-3.4, -1.1, 0.30),
      new THREE.Vector3(-1.6, -0.4, -0.15),
      new THREE.Vector3(0.4, 0.8, 0.20),
      new THREE.Vector3(2.2, 0.1, -0.25),
      new THREE.Vector3(4.4, 0.7, 0.15),
      new THREE.Vector3(6.8, -0.4, 0.0)
    ], false, 'centripetal', 0.5);

    // Child branches growing organically upward from the trunk
    const branchCurve1 = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-3.4, -1.1, 0.30),
      new THREE.Vector3(-2.2, 0.7, 0.35),
      new THREE.Vector3(-0.9, 2.0, 0.20),
      new THREE.Vector3(0.4, 3.1, 0.10)
    ], false, 'centripetal', 0.5);

    const branchCurve2 = new THREE.CatmullRomCurve3([
      new THREE.Vector3(2.2, 0.1, -0.25),
      new THREE.Vector3(3.6, 1.7, 0.15),
      new THREE.Vector3(5.1, 2.6, 0.05),
      new THREE.Vector3(6.6, 3.3, -0.10)
    ], false, 'centripetal', 0.5);

    function buildTree() {
      const trunkPts = trunkCurve.getPoints(120);
      trunkPts.forEach((p, idx) => {
        const widthScale = 1.0 - (idx / trunkPts.length) * 0.55;
        mainTrunkStroke.addPoint(p, widthScale);
      });

      const b1Pts = branchCurve1.getPoints(60);
      b1Pts.forEach((p, idx) => {
        const widthScale = 0.9 - (idx / b1Pts.length) * 0.5;
        branchStroke1.addPoint(p, widthScale);
      });

      const b2Pts = branchCurve2.getPoints(60);
      b2Pts.forEach((p, idx) => {
        const widthScale = 0.85 - (idx / b2Pts.length) * 0.5;
        branchStroke2.addPoint(p, widthScale);
      });
    }
    buildTree();
    updateCamera();

    // Pre-calculate Spline Samples & Frenet Frame for Impuls 1 Trajectory
    const TRUNK_SAMPLES = 200;
    const trunkSamplePositions = [];
    const trunkSampleTangents = [];
    const trunkSampleNormals = [];
    const trunkSampleBinormals = [];

    function precalculateTrunkSpline() {
      trunkSamplePositions.length = 0;
      trunkSampleTangents.length = 0;
      trunkSampleNormals.length = 0;
      trunkSampleBinormals.length = 0;

      for (let i = 0; i <= TRUNK_SAMPLES; i++) {
        const t = i / TRUNK_SAMPLES;
        const pt = trunkCurve.getPointAt(t);
        const tangent = trunkCurve.getTangentAt(t).normalize();

        let up = new THREE.Vector3(0, 0, 1);
        let normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
        if (normal.lengthSq() < 0.001) {
          up.set(0, 1, 0);
          normal.crossVectors(tangent, up).normalize();
        }
        const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();

        trunkSamplePositions.push(pt);
        trunkSampleTangents.push(tangent);
        trunkSampleNormals.push(normal);
        trunkSampleBinormals.push(binormal);
      }
    }
    precalculateTrunkSpline();

    function getTrunkFrame(t, outPos, outNormal, outBinormal) {
      const clampedT = Math.max(0, Math.min(1, t));
      const idxF = clampedT * TRUNK_SAMPLES;
      const idx0 = Math.floor(idxF);
      const idx1 = Math.min(TRUNK_SAMPLES, idx0 + 1);
      const frac = idxF - idx0;

      const p0 = trunkSamplePositions[idx0];
      const p1 = trunkSamplePositions[idx1];
      outPos.lerpVectors(p0, p1, frac);

      const n0 = trunkSampleNormals[idx0];
      const n1 = trunkSampleNormals[idx1];
      outNormal.lerpVectors(n0, n1, frac).normalize();

      const b0 = trunkSampleBinormals[idx0];
      const b1 = trunkSampleBinormals[idx1];
      outBinormal.lerpVectors(b0, b1, frac).normalize();
    }

    // =========================================================================
    // 5. VOLUMETRIC FRACTAL RAYMARCHING ORBS (PLEXUS 1:1)
    // =========================================================================

    const FRACTAL_PRESETS = [
      {
        name: 'Mandelbulb Hybrid',
        colorA: new THREE.Color(0x00f0ff),
        colorB: new THREE.Color(0xd946ef),
        core: new THREE.Color(0xffffff),
        complexity: 0.65,
        morphSpeed: 0.8
      },
      {
        name: 'Julia Folding',
        colorA: new THREE.Color(0x38bdf8),
        colorB: new THREE.Color(0x10e782),
        core: new THREE.Color(0xffffff),
        complexity: 0.55,
        morphSpeed: 1.1
      },
      {
        name: 'Kleinian Spiral',
        colorA: new THREE.Color(0xff80df),
        colorB: new THREE.Color(0xfbbf24),
        core: new THREE.Color(0xffffff),
        complexity: 0.72,
        morphSpeed: 0.7
      },
      {
        name: 'Apollonian Web',
        colorA: new THREE.Color(0x818cf8),
        colorB: new THREE.Color(0xec4899),
        core: new THREE.Color(0xffffff),
        complexity: 0.60,
        morphSpeed: 0.9
      }
    ];

    class VolumetricFractalOrbMesh {
      constructor(x, y, z, radius, presetIdx = 0) {
        this.x = x;
        this.y = y;
        this.z = z;
        this.baseX = x;
        this.baseY = y;
        this.radius = radius;
        this.preset = FRACTAL_PRESETS[presetIdx % FRACTAL_PRESETS.length];
        this.glowPulse = 1.0;

        this.uniforms = {
          uTime: { value: 0 },
          uMorph: { value: 0.0 },
          uComplexity: { value: this.preset.complexity },
          uColorShift: { value: presetIdx * 0.25 },
          uPulse: { value: 1.0 },
          uGlowIntensity: { value: 1.3 },
          uAlpha: { value: 1.0 },
          uColorA: { value: this.preset.colorA },
          uColorB: { value: this.preset.colorB },
          uColorCore: { value: this.preset.core }
        };

        const geom = new THREE.SphereGeometry(radius, 32, 32);
        this.mat = new THREE.ShaderMaterial({
          vertexShader: fractalOrbVertexShader,
          fragmentShader: fractalOrbFragmentShader,
          uniforms: this.uniforms,
          transparent: true,
          depthWrite: false
        });
        this.mesh = new THREE.Mesh(geom, this.mat);
        this.mesh.position.set(x, y, z);
        orbsGroup.add(this.mesh);

        // Atmosphere halo
        this.atmoUniforms = {
          uTime: { value: 0 },
          uPulse: { value: 1.0 },
          uGlowIntensity: { value: 1.4 },
          uColorA: { value: this.preset.colorA },
          uColorB: { value: this.preset.colorB },
          uAlpha: { value: 0.85 }
        };
        const atmoGeom = new THREE.SphereGeometry(radius * 1.35, 32, 32);
        this.atmoMat = new THREE.ShaderMaterial({
          vertexShader: fractalOrbVertexShader,
          fragmentShader: atmosphereFragmentShader,
          uniforms: this.atmoUniforms,
          transparent: true,
          side: THREE.BackSide,
          depthWrite: false
        });
        this.atmoMesh = new THREE.Mesh(atmoGeom, this.atmoMat);
        this.mesh.add(this.atmoMesh);
      }

      update(time, delta) {
        this.uniforms.uTime.value = time * this.preset.morphSpeed;
        this.uniforms.uMorph.value = (Math.sin(time * 0.5) + 1.0) * 0.5;
        this.atmoUniforms.uTime.value = time;

        const pulseVal = (0.92 + 0.08 * Math.sin(time * 3.0)) * this.glowPulse;
        this.uniforms.uPulse.value = pulseVal;
        this.atmoUniforms.uPulse.value = pulseVal;

        if (this.glowPulse > 1.0) {
          this.glowPulse = Math.max(1.0, this.glowPulse - delta * 1.5);
        }

        this.mesh.position.y = this.baseY + Math.sin(time * 1.2 + this.baseX) * 0.25;
      }
    }

    const volumetricOrbs = [

    // --- IMPULS 1: VEIL TEXTURE & POINTS (SCHLEIER) ---
    function createVeilParticleTexture() {
      const c = document.createElement('canvas');
      c.width = 32;
      c.height = 32;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 15);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(0.28, 'rgba(255, 205, 240, 0.7)');
      grad.addColorStop(0.60, 'rgba(217, 70, 239, 0.22)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 32, 32);
      const tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      return tex;
    }
    const veilParticleTex = createVeilParticleTexture();

    const VEIL_PARTICLE_COUNT = 4500;

    const veilRadius = new Float32Array(VEIL_PARTICLE_COUNT);
    const veilAngle = new Float32Array(VEIL_PARTICLE_COUNT);

    // --- TRIGGER 1: TUSCHE-ATEM (SCHLEIER) ---
    // --- TRIGGER 1: TUSCHE-ATEM (ASTBAHN-SCHLEIER) ---
    function triggerImpulse1() {
      setActiveButton('btn-impulse-1');
      currentActiveImpulse = 'INHALE';
      impulseTime = 0.0;
      impulseDuration = 3.0;
      telemetryMode.innerText = 'Impuls 1: Tusche-Atem';
      infoText.innerText = 'Mikropartikel formieren sich entlang der 3D-Stammbahn; Ast materialisiert direkt aus dem Schleier.';
      drawingHint.style.display = 'none';

      // Ast einblenden, Orbs ausblenden
      branchGroup.visible = true;
      orbsGroup.visible = false;

      mainTrunkStroke.uniforms.uProgress.value = 0.0;
      branchStroke1.uniforms.uProgress.value = 0.0;
      branchStroke2.uniforms.uProgress.value = 0.0;
      colorPaletteBar.classList.remove('visible');

      // Initialize 4,500 Veil Micro-Particles along the trunk spline
      const streamColors = [
        new THREE.Color(0xffffff),
        new THREE.Color(0xffd4f2),
        new THREE.Color(0xff99dd),
        new THREE.Color(0xf472b6),
        new THREE.Color(0xffe4f7)
      ];

      const tempPos = new THREE.Vector3();
      const tempNormal = new THREE.Vector3();
      const tempBinormal = new THREE.Vector3();

      for (let i = 0; i < VEIL_PARTICLE_COUNT; i++) {
        // Distribute along the whole trunk curve (0.0 to 1.0)
        const tVal = Math.pow(i / VEIL_PARTICLE_COUNT, 0.95);
        veilT[i] = tVal;

        // Tapered radius: wider at the root, finer near the tip
        const taper = 1.0 - tVal * 0.55;
        const rad = (0.12 + Math.pow(Math.random(), 1.6) * 0.95) * taper;
        veilRadius[i] = rad;

        veilAngle[i] = Math.random() * Math.PI * 2;
        veilSpeed[i] = 0.08 + Math.random() * 0.12;
        veilWanderPhase[i] = Math.random() * Math.PI * 2;
        veilTurbAmp[i] = 0.04 + Math.random() * 0.08;

        getTrunkFrame(tVal, tempPos, tempNormal, tempBinormal);
        const cosA = Math.cos(veilAngle[i]);
        const sinA = Math.sin(veilAngle[i]);
        const startScatter = 2.4; // Initial spread before converging into the curve

        const i3 = i * 3;
        veilPositions[i3] = tempPos.x + (tempNormal.x * cosA + tempBinormal.x * sinA) * rad * startScatter;
        veilPositions[i3 + 1] = tempPos.y + (tempNormal.y * cosA + tempBinormal.y * sinA) * rad * startScatter;
        veilPositions[i3 + 2] = tempPos.z + (tempNormal.z * cosA + tempBinormal.z * sinA) * rad * startScatter;

        const col = streamColors[i % streamColors.length];
        veilColors[i3] = col.r;
        veilColors[i3 + 1] = col.g;
        veilColors[i3 + 2] = col.b;
      }
      veilGeom.attributes.position.needsUpdate = true;
      veilGeom.attributes.color.needsUpdate = true;
      veilMat.opacity = 0.0;
    }

    // --- TRIGGER 2: 8 FARBKNOTENPUNKTE IM SAKURACANVAS-STIL (5.0s) ---
    function triggerImpulse2() {
      setActiveButton('btn-impulse-2');
      currentActiveImpulse = 'SPORES';
      impulseTime = 0.0;
      impulseDuration = 5.0; // 5 Sekunden Laufzeit
      telemetryMode.innerText = 'Impuls 2: 8 Farbknoten';
      infoText.innerText = '8 sakurafarbene Knotenpunkte (authentischer SakuraCanvas-Stil mit Guide-Lines) pulsieren 5s lang und zerfallen in Paletten-Farben.';
      drawingHint.style.display = 'none';

      // Ast einblenden, Orbs ausblenden
      branchGroup.visible = true;
      orbsGroup.visible = false;

      mainTrunkStroke.uniforms.uProgress.value = 1.0;
      branchStroke1.uniforms.uProgress.value = 1.0;
      branchStroke2.uniforms.uProgress.value = 1.0;
      colorPaletteBar.classList.remove('visible');

      // Clear previous nodes
      while (sumiNodeGroup.children.length > 0) {
        sumiNodeGroup.remove(sumiNodeGroup.children[0]);
      }
      sumiOrbNodes = [];
      sporeDust3D = [];

      const curvesPool = [
        { c: trunkCurve, t: 0.22, angle: 26 },
        { c: trunkCurve, t: 0.42, angle: -24 },
        { c: trunkCurve, t: 0.64, angle: 28 },
        { c: trunkCurve, t: 0.85, angle: -22 },
        { c: branchCurve1, t: 0.35, angle: 30 },
        { c: branchCurve1, t: 0.78, angle: -28 },
        { c: branchCurve2, t: 0.38, angle: 25 },
        { c: branchCurve2, t: 0.82, angle: -26 }
      ];

      const paletteColors = [
        new THREE.Color(0xff2a9d),
        new THREE.Color(0xef4444),
        new THREE.Color(0x00f0ff),
        new THREE.Color(0x10e782),
        new THREE.Color(0xfbbf24)
      ];

      for (let i = 0; i < 8; i++) {
        const def = curvesPool[i];
        const pt = def.c.getPoint(def.t);
        const col = paletteColors[i % paletteColors.length];

        // Authentic SakuraCanvas OrbNode Plane (planeSize = 2.2)
        const nodeGeom = new THREE.PlaneGeometry(2.2, 2.2);
        const nodeMat = new THREE.ShaderMaterial({
          vertexShader: orbMeshVertexShader,
          fragmentShader: sakuraOrbFragmentShader,
          uniforms: {
            uAlpha: { value: 0.0 },
            uTime: { value: 0.0 },
            uColor: { value: new THREE.Color(0xffb5dc) }
          },
          transparent: true,
          depthWrite: false
        });
        const nodeMesh = new THREE.Mesh(nodeGeom, nodeMat);
        nodeMesh.position.set(pt.x, pt.y, pt.z + 0.15);
        sumiNodeGroup.add(nodeMesh);

        // Dashed Guide Direction Line (SakuraCanvas OrbNode style)
        const lineMat = new THREE.LineDashedMaterial({
          color: 0xffffff,
          dashSize: 0.22,
          gapSize: 0.12,
          transparent: true,
          opacity: 0.0,
          depthWrite: false
        });

        const angleRad = THREE.MathUtils.degToRad(def.angle);
        const guideDir = new THREE.Vector3(Math.cos(angleRad), Math.sin(angleRad), 0).normalize();

        const lineGeom = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3().copy(guideDir).multiplyScalar(0.95)
        ]);

        const guideLine = new THREE.Line(lineGeom, lineMat);
        guideLine.computeLineDistances();
        nodeMesh.add(guideLine);

        sumiOrbNodes.push({
          nodeMesh: nodeMesh,
          guideLine: guideLine,
          basePt: pt.clone(),
          pos: pt.clone(),
          color: col,
          bornTime: 0.1 * i,
          hasDispersed: false,
          isExploding: false,
          explosionTimer: 0.0
        });
      }
    }

    // =========================================================================
    // 8. INTERACTIVE CIRCLE DRAWING GESTURE (MOUSE / TOUCH)
    // =========================================================================

    function startDrawing(e) {
      if (currentActiveImpulse !== 'CIRCLE_ZOOM') {
        // If user drags anywhere, activate circle zoom mode
        triggerImpulse3();
        autoSimulateCircle = false;
      }
      isDrawing = true;
      autoSimulateCircle = false;
      circleTrail = [];
      targetZoomMultiplier = 1.07;

      const rect = drawingCanvas.getBoundingClientRect();
      const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
      const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
      circleTrail.push({ x, y, alpha: 1.0 });
    }

    function drawMove(e) {
      if (!isDrawing) return;
      const rect = drawingCanvas.getBoundingClientRect();
      const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
      const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
      circleTrail.push({ x, y, alpha: 1.0 });

      // Subtle dynamic camera zoom responsive to drawing activity
      targetZoomMultiplier = Math.min(1.08, targetZoomMultiplier + 0.001);
    }

    function stopDrawing() {
      isDrawing = false;
      // Gentle relaxation back to standard framing after 1.5s
      setTimeout(() => {
        if (!isDrawing && currentActiveImpulse === 'CIRCLE_ZOOM') {
          targetZoomMultiplier = 1.0;
        }
      }, 1500);
    }

    drawingCanvas.addEventListener('mousedown', startDrawing);
    window.addEventListener('mousemove', drawMove);
    window.addEventListener('mouseup', stopDrawing);

    drawingCanvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); }, { passive: false });
    window.addEventListener('touchmove', (e) => { drawMove(e); }, { passive: true });
    window.addEventListener('touchend', stopDrawing);

    // =========================================================================
    // 9. ANIMATION & RENDER LOOP
    // =========================================================================

    let lastTime = performance.now();
    let frameCount = 0;
    let fpsTimer = 0.0;

    function animate(now) {
      requestAnimationFrame(animate);

      const delta = Math.min((now - lastTime) * 0.001, 0.1);
      lastTime = now;

      frameCount++;
      fpsTimer += delta;
      if (fpsTimer >= 1.0) {
        document.getElementById('fps-counter').innerText = `${frameCount} FPS`;
        frameCount = 0;
        fpsTimer = 0;
      }

      // Smooth Camera Zoom Interpolation
      if (Math.abs(currentZoomMultiplier - targetZoomMultiplier) > 0.0005) {
        currentZoomMultiplier += (targetZoomMultiplier - currentZoomMultiplier) * (delta * 4.5);
        updateCamera();
      }

      bgUniforms.iTime.value += delta;
      mainTrunkStroke.uniforms.uTime.value += delta;
      branchStroke1.uniforms.uTime.value += delta;
      branchStroke2.uniforms.uTime.value += delta;

      if (orbsGroup.visible) {
        volumetricOrbs.forEach(orb => orb.update(now * 0.001, delta));
      }

      // Drawing Canvas Fade & Brush Rendering
      drawingCtx.clearRect(0, 0, width, height);

      // Auto-simulate circle drawing when Impuls 3 is triggered
      if (autoSimulateCircle) {
        autoSimTimer += delta;
        const simSpeed = 1.8;
        const simAngle = autoSimTimer * simSpeed;
        const centerX = width * 0.45;
        const centerY = height * 0.48;
        const radius = Math.min(width, height) * 0.22;

        if (simAngle <= Math.PI * 2.2) {
          const simX = centerX + Math.cos(simAngle) * radius;
          const simY = centerY + Math.sin(simAngle) * radius;
          circleTrail.push({ x: simX, y: simY, alpha: 1.0 });
        } else if (autoSimTimer > 2.8) {
          targetZoomMultiplier = 1.0;
        }
      }

      // Render glowing luminous ink trail
      if (circleTrail.length > 1) {
        drawingCtx.save();
        drawingCtx.lineCap = 'round';
        drawingCtx.lineJoin = 'round';

        for (let i = 1; i < circleTrail.length; i++) {
          const p0 = circleTrail[i - 1];
          const p1 = circleTrail[i];

          drawingCtx.beginPath();
          drawingCtx.moveTo(p0.x, p0.y);
          drawingCtx.lineTo(p1.x, p1.y);

          // Outer soft glow
          drawingCtx.strokeStyle = `rgba(255, 42, 157, ${p1.alpha * 0.35})`;
          drawingCtx.lineWidth = 14;
          drawingCtx.stroke();

          // Inner vibrant core
          drawingCtx.beginPath();
          drawingCtx.moveTo(p0.x, p0.y);
          drawingCtx.lineTo(p1.x, p1.y);
          drawingCtx.strokeStyle = `rgba(255, 230, 250, ${p1.alpha * 0.95})`;
          drawingCtx.lineWidth = 3.5;
          drawingCtx.stroke();

          // Particle decay
          p0.alpha = Math.max(0, p0.alpha - delta * 0.45);
        }
        drawingCtx.restore();

        // Prune dead points
        while (circleTrail.length > 0 && circleTrail[0].alpha <= 0.02) {
          circleTrail.shift();
        }
      }

      // Active Impulses Logic
      if (currentActiveImpulse) {
        impulseTime += delta;
        const remaining = Math.max(0, impulseDuration - impulseTime);
        telemetryTimer.innerText = `${remaining.toFixed(1)}s`;

        // 1. INHALE (TUSCHE-ATEM: SCHLEIER ENTLANG DER ASTBAHN)
        if (currentActiveImpulse === 'INHALE') {
          const p = Math.min(1.0, impulseTime / impulseDuration);

          // Ambient dimming
          if (p < 0.35) {
            bgUniforms.uBgDim.value = THREE.MathUtils.lerp(1.0, 0.88, p / 0.35);
            emberMat.opacity = (p / 0.35) * 0.95;
            emberMesh.scale.setScalar(1.0 + Math.sin(p * 15.0) * 0.3);
          } else if (p > 0.85) {
            bgUniforms.uBgDim.value = THREE.MathUtils.lerp(0.88, 1.0, (p - 0.85) / 0.15);
            emberMat.opacity = (1.0 - (p - 0.85) / 0.15) * 0.95;
          }

          // Convergence: starts at 2.4x scatter, concentrates onto the exact branch curve by p=0.25
          const convergence = p < 0.25 ? THREE.MathUtils.lerp(2.4, 1.0, p / 0.25) : 1.0;
          const veilFade = p < 0.15 ? (p / 0.15) : (p > 0.85 ? (1.0 - (p - 0.85) / 0.15) : 1.0);
          veilMat.opacity = veilFade * 0.88;

          // Progressive Branch Growth (Starts at 0.8s, complete by 2.8s)
          let growthProg = 0.0;
          if (impulseTime > 0.8) {
            growthProg = Math.min(1.0, (impulseTime - 0.8) / 1.8);
            mainTrunkStroke.uniforms.uProgress.value = growthProg;
            if (growthProg > 0.45) {
              const bProg = (growthProg - 0.45) / 0.55;
              branchStroke1.uniforms.uProgress.value = bProg;
              branchStroke2.uniforms.uProgress.value = bProg;
            }
          }

          const tempPos = new THREE.Vector3();
          const tempNormal = new THREE.Vector3();
          const tempBinormal = new THREE.Vector3();

          for (let i = 0; i < VEIL_PARTICLE_COUNT; i++) {
            // Forward flow along the spline
            const curT = (veilT[i] + impulseTime * veilSpeed[i] * 0.08) % 1.0;
            getTrunkFrame(curT, tempPos, tempNormal, tempBinormal);

            // Subtle harmonic smoke turbulence
            const turb = Math.sin(impulseTime * 3.2 + veilWanderPhase[i]) * veilTurbAmp[i];
            const angle = veilAngle[i] + impulseTime * 0.4;
            const cosA = Math.cos(angle);
            const sinA = Math.sin(angle);

            // Condensation into ink branch: particles near the tip intensify, behind the tip they absorb
            let condensation = 1.0;
            if (growthProg > 0.01) {
              if (curT < growthProg - 0.08) {
                condensation = Math.max(0.05, 1.0 - (growthProg - curT) * 4.0);
              } else if (Math.abs(curT - growthProg) < 0.06) {
                condensation = 1.35; // Bright condensation focus at growing tip
              }
            }

            const rad = Math.max(0.01, veilRadius[i] * convergence * condensation + turb);

            const i3 = i * 3;
            veilPositions[i3] = tempPos.x + (tempNormal.x * cosA + tempBinormal.x * sinA) * rad;
            veilPositions[i3 + 1] = tempPos.y + (tempNormal.y * cosA + tempBinormal.y * sinA) * rad;
            veilPositions[i3 + 2] = tempPos.z + (tempNormal.z * cosA + tempBinormal.z * sinA) * rad;
          }
          veilGeom.attributes.position.needsUpdate = true;
        }

        // 2. 8 FARBKNOTEN (5.0s · SAKURACANVAS STIL & SPORENZERFALL)
        if (currentActiveImpulse === 'SPORES') {
          const swayTime = now * 0.001;

          sumiOrbNodes.forEach(node => {
            node.nodeMesh.material.uniforms.uTime.value = impulseTime;

            // Authentic wind sway matching SakuraCanvas
            const normX = Math.max(0.0, Math.min(1.0, (node.basePt.x + 11.5) / 20.0));
            const mainSway = Math.sin(swayTime * 1.25) * 0.38;
            const subSway = Math.sin(swayTime * 0.60) * 0.14;
            node.nodeMesh.position.y = node.basePt.y + (mainSway + subSway) * normX;

            if (impulseTime < 2.0) {
              // Phase 1: Appear, gently breathe and pulse with dashed guide lines (0.0s - 2.0s)
              const appearProg = Math.min(1.0, impulseTime / 0.8);
              node.nodeMesh.material.uniforms.uAlpha.value = appearProg * 0.98;
              if (node.guideLine) {
                node.guideLine.material.opacity = appearProg * 0.75;
              }
              const pulse = 1.0 + Math.sin(impulseTime * 4.0) * 0.08;
              node.nodeMesh.scale.setScalar(pulse);
            } else if (!node.hasDispersed) {
              // Phase 2: Explode and dissolve into palette-colored spores (2.0s - 3.6s)
              if (!node.isExploding) {
                node.isExploding = true;
                node.explosionTimer = 0.0;
              }
              node.explosionTimer += delta;
              const expT = Math.min(1.0, node.explosionTimer / 0.45);
              const easeOut = 1.0 - Math.pow(1.0 - expT, 3.0);
              node.nodeMesh.scale.setScalar(1.0 + easeOut * 2.2);
              node.nodeMesh.material.uniforms.uAlpha.value = (1.0 - expT) * 0.95;
              if (node.guideLine) {
                node.guideLine.material.opacity = (1.0 - expT) * 0.75;
              }

              if (expT >= 1.0) {
                node.hasDispersed = true;
                node.nodeMesh.visible = false;

                // Spawn 32 fine particles in this node's palette color
                const dustGeom = new THREE.SphereGeometry(0.09, 8, 8);
                for (let d = 0; d < 32; d++) {
                  const vel = new THREE.Vector3(
                    (Math.random() - 0.5) * 3.8,
                    0.4 + Math.random() * 3.2,
                    (Math.random() - 0.5) * 3.2
                  );
                  const dMat = new THREE.MeshBasicMaterial({ color: node.color, transparent: true, opacity: 0.95 });
                  const dMesh = new THREE.Mesh(dustGeom, dMat);
                  dMesh.position.copy(node.nodeMesh.position);
                  branchGroup.add(dMesh);

                  sporeDust3D.push({
                    mesh: dMesh,
                    vel: vel,
                    life: 2.2 + Math.random() * 0.6,
                    maxLife: 2.8
                  });
                }
              }
            }
          });

          // Phase 3: Palette reveal at 3.6s
          if (impulseTime > 3.6) {
            colorPaletteBar.classList.add('visible');
          }
        }

        // 3. CIRCLE ZOOM
        if (currentActiveImpulse === 'CIRCLE_ZOOM') {
          if (impulseTime >= impulseDuration && !isDrawing) {
            targetZoomMultiplier = 1.0;
          }
        }

        // 4. PLEXUS SYNAPTIC WEB
        if (currentActiveImpulse === 'PLEXUS_DOCK') {
          const p = impulseTime / impulseDuration;
          const decay = Math.max(0, 1.0 - p);
          const flicker = 0.65 + 0.35 * Math.sin(impulseTime * 35.0);
          synapticMat.opacity = decay * flicker * 0.85;
        }

        if (impulseTime >= impulseDuration) {
          if (currentActiveImpulse === 'INHALE') {
            bgUniforms.uBgDim.value = 1.0;
            emberMat.opacity = 0.0;
            veilMat.opacity = 0.0;
          }
          if (currentActiveImpulse === 'PLEXUS_DOCK') synapticMat.opacity = 0.0;
          currentActiveImpulse = null;
        }
      }

      // Update Spore Dust Particle Dispersion
      for (let i = sporeDust3D.length - 1; i >= 0; i--) {
        const dust = sporeDust3D[i];
        dust.mesh.position.addScaledVector(dust.vel, delta);
        dust.vel.y += delta * 0.6; // Soft upward lift
        dust.life -= delta;
        dust.mesh.material.opacity = Math.max(0, dust.life / dust.maxLife);
        if (dust.life <= 0) {
          branchGroup.remove(dust.mesh);
          sporeDust3D.splice(i, 1);
        }
      }

      renderer.clear();
      renderer.render(bgScene, bgCamera);
      renderer.render(mainScene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
