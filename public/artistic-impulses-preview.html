<!DOCTYPE html>
<html lang="de" class="h-full bg-[#08020e]">
<head>

  <!-- Three.js r128 Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Exo 2', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #08020e;
      color: #ffffff;
    }

    #scene-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: center center;
      transition: transform 0.05s ease-out;
    }

    #webgl-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Chromatic Fringe Vignette Layer */
    #chromatic-fringe {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      mix-blend-mode: screen;
      transition: opacity 0.25s ease;
      background: radial-gradient(circle at center, transparent 55%, rgba(255, 42, 157, 0.28) 85%, rgba(78, 226, 236, 0.45) 100%);
      box-shadow: inset 0 0 80px rgba(255, 42, 157, 0.4), inset 0 0 140px rgba(78, 226, 236, 0.3);
      z-index: 20;
    }

    /* Top Telemetry Header */
    .top-header {
      position: absolute;
      top: 18px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 50;
    }
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 9999px;
      background: rgba(18, 10, 28, 0.88);
      border: 1px solid rgba(255, 105, 180, 0.4);
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 42, 157, 0.25);
    }
    .brand-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffffff, #ffb4dc, #ff2a9d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .telemetry-pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 8px 18px;
      border-radius: 9999px;
      background: rgba(18, 10, 28, 0.88);
      border: 1px solid rgba(78, 226, 236, 0.4);

    /* Floating Palette Bar */
    #color-palette-bar {
      position: absolute;
      bottom: 132px;
      left: 50%;
      transform: translateX(-50%) translateY(20px) scale(0.9);
      opacity: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 22px;
      background: rgba(18, 10, 28, 0.94);
      border: 1px solid rgba(255, 105, 180, 0.5);
      border-radius: 9999px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85), 0 0 30px rgba(255, 42, 157, 0.35);
      backdrop-filter: blur(20px);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: auto;
      z-index: 40;
    }
    #color-palette-bar.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }
    .palette-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid rgba(255, 255, 255, 0.4);
      transition: transform 0.25s ease, box-shadow 0.25s ease;

    .palette-circle:hover {
      transform: scale(1.25);
      border-color: #ffffff;
      box-shadow: 0 0 16px currentColor;
    }

    /* Live Info Box */
    #info-banner {
      position: absolute;
      top: 75px;
      left: 50%;
      transform: translateX(-50%);

    @keyframes ping {

    /* Bottom Interactive Dock */
    .control-dock {
      position: absolute;
      bottom: 20px;

    .button-grid {

    .impulse-btn {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;

    .impulse-btn:hover {

      border-color: rgba(255, 105, 180, 0.5);

<body>

  <!-- Viewport Container for Scene Heartbeat Scaling -->

  <!-- Header -->

        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3c1.5 2.5 1.5 5 0 7-1.5-2-1.5-4.5 0-7zm6 3c.5 3-1 5-3 5.5 1-2.5 1-4.5 3-5.5zM6 6c2 1 2 3 3 5.5-2-.5-3.5-2.5-3-5.5zm11 9c-1 2.5-3 3-5.5 3 2-1 3-2.5 5.5-3zm-10 0c2.5.5 3.5 2 5.5 3-2.5 0-4.5-.5-5.5-3z" />

  <div class="control-dock">

  <script>
    // =========================================================================
    // 1. EXACT SHADERS FROM SakuraCanvas.tsx
    // =========================================================================

    const bgVertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `;

    const bgFragmentShader = `
      uniform vec3 iResolution;
      uniform float iTime;
      uniform sampler2D iChannel0;
      uniform float uKaleidoscope;
      uniform float uRippleActive;
      uniform float uRippleTime;
      uniform vec3 uBgColor1;
      uniform vec3 uBgColor2;
      uniform vec3 uBgColor3;
      uniform vec3 uRippleCrest;
      uniform float uBgBlend;
      uniform float uBgDim;
      varying vec2 vUv;

      float noise(in vec2 x) {
        vec2 p = floor(x);
        vec2 f = fract(x);
        f = f * f * (3.0 - 2.0 * f);
        float a = texture2D(iChannel0, (p + vec2(0.5, 0.5)) / 256.0).x;
        float b = texture2D(iChannel0, (p + vec2(1.5, 0.5)) / 256.0).x;
        float c = texture2D(iChannel0, (p + vec2(0.5, 1.5)) / 256.0).x;
        float d = texture2D(iChannel0, (p + vec2(1.5, 1.5)) / 256.0).x;
        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
      }

      const mat2 mtx = mat2(0.80, 0.60, -0.60, 0.80);

      float fbm(vec2 p) {
        float f = 0.0;
        f += 0.500000 * noise(p); p = mtx * p * 2.02;
        f += 0.250000 * noise(p); p = mtx * p * 2.03;
        f += 0.125000 * noise(p); p = mtx * p * 2.01;
        f += 0.062500 * noise(p); p = mtx * p * 2.04;
        f += 0.031250 * noise(p); p = mtx * p * 2.01;
        f += 0.015625 * noise(p);
        return f / 0.96875;
      }

      float pattern(in vec2 p, in float t, in vec2 uv) {
        vec2 q = vec2(fbm(p), fbm(p + vec2(10.0, 1.3)));
        vec2 r = vec2(fbm(p + 4.0 * q + vec2(t) + vec2(1.7, 9.2)), fbm(p + 4.0 * q + vec2(t) + vec2(8.3, 2.8)));
        vec2 g = vec2(fbm(p + 2.0 * r + vec2(t * 20.0) + vec2(2.0, 6.0)), fbm(p + 2.0 * r + vec2(t * 10.0) + vec2(5.0, 3.0)));
        return fbm(p + 5.5 * g + vec2(-t * 7.0));
      }

      void main() {
        vec2 fragCoord = gl_FragCoord.xy;
        vec2 uv = clamp(fragCoord / max(iResolution.xy, vec2(1.0)), 0.0, 1.0);
        
        vec2 rippleOffset = vec2(0.0);
        float waveNormal = 0.0;
        float waveFade = 0.0;
        float insideWave = 0.0;

        if (uRippleActive > 0.5) {
          vec2 centerUv = uv - vec2(0.5);
          centerUv.x *= iResolution.x / iResolution.y;
          float dist = length(centerUv);

          float waveRadius = (uRippleTime / 3.0) * 1.8;
          float waveDist = abs(dist - waveRadius);

          float wavePhase = waveDist * 32.0 - uRippleTime * 9.0;
          waveNormal = cos(wavePhase) * exp(-waveDist * waveDist * 110.0);
          waveFade = smoothstep(3.0, 2.2, uRippleTime) * smoothstep(0.0, 0.1, uRippleTime);

          insideWave = smoothstep(waveRadius + 0.15, waveRadius - 0.15, dist) * waveFade;
          rippleOffset = normalize(centerUv + vec2(0.0001)) * waveNormal * 0.045 * waveFade;
        }

        vec2 distortedFragCoord = fragCoord + rippleOffset * iResolution.xy;
        vec2 distortedUv = clamp(uv + rippleOffset, 0.0, 1.0);

        float noiseVal = pattern(distortedFragCoord * vec2(0.004), iTime * 0.007, distortedUv);
        
        float effectiveBlend = clamp(max(uBgBlend, insideWave), 0.0, 1.0);
        vec3 baseC1 = mix(vec3(0.05, 0.00, 0.02), uBgColor1, effectiveBlend);
        vec3 baseC2 = mix(vec3(0.74, 0.00, 0.36), uBgColor2, effectiveBlend);
        vec3 baseC3 = mix(vec3(0.80, 0.04, 0.44), uBgColor3, effectiveBlend);

        vec3 col = mix(baseC1, baseC2, smoothstep(0.0, 1.0, noiseVal));
        col = mix(col, baseC1 * 2.2, noiseVal * 0.8);
        col = mix(col, baseC3, 0.35 * noiseVal);
        col = mix(col, baseC2 * 0.7, smoothstep(0.0, 0.6, 0.6 * noiseVal));
        col = mix(col, baseC3 * 1.1, 0.12 * noiseVal);
        
        col *= noiseVal * 1.68;

        if (uRippleActive > 0.5) {
          col += uRippleCrest * waveNormal * waveFade * 0.65;
        }

        float vignetteVal = max(0.0, 70.0 * uv.x * uv.y * (1.0 - uv.x) * (1.0 - uv.y));
        col *= (0.80 * (0.70 + 0.65 * sqrt(vignetteVal))) * uBgDim;
        col *= 0.90;
        
        gl_FragColor = vec4(col, 1.0);
      }
    `;

    // Sumi-e 3D Ribbon Stroke Shaders
    const sumiVertexShader = `
      varying vec2 vUv;
      varying vec3 vPosition;
      uniform float uTime;

      void main() {
        vUv = uv;
        vPosition = position;
        float normX = clamp((position.x + 11.5) / 20.0, 0.0, 1.0);
        float mainSway = sin(uTime * 1.25) * 0.38;
        float subSway  = sin(uTime * 0.60) * 0.14;
        
        vec3 displacedPos = position;
        displacedPos.y += (mainSway + subSway) * normX;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(displacedPos, 1.0);
      }
    `;

    const sumiFragmentShader = `
      varying vec2 vUv;
      varying vec3 vPosition;
      uniform vec3 uColor;
      uniform float uTotalLength;
      uniform float uProgress;
      uniform float uAlpha;

      vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
      float snoise(vec2 v){
        const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
        vec2 i  = floor(v + dot(v, C.yy) );
        vec2 x0 = v -   i + dot(i, C.xx);
        vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
        vec4 x12 = x0.xyxy + C.xxzz;
        x12.xy -= i1;
        vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
        vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
        m = m*m; m = m*m;
        vec3 x = 2.0 * fract(p * C.www) - 1.0;
        vec3 h = abs(x) - 0.5;
        vec3 ox = floor(x + 0.5);
        vec3 a0 = x - ox;
        m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
        vec3 g;
        g.x  = a0.x  * x0.x  + h.x  * x0.y;
        g.yz = a0.yz * x12.xz + h.yz * x12.yw;
        return 130.0 * dot(m, g);
      }

      void main() {
        float currentLength = uTotalLength * uProgress;
        if (vUv.y > currentLength) discard;

        float noiseVal = snoise(vec2(vUv.x * 30.0, vUv.y * 8.0));
        float wave = snoise(vec2(vUv.y * 2.0)) * 0.15;
        float distortedX = clamp(vUv.x + wave, 0.0, 1.0);
        float edgeBias = pow(distortedX, 2.0); 
        float threshold = mix(-1.5, 0.4, edgeBias); 
        
        float alpha = 0.95;
        float erosion = smoothstep(threshold, threshold + 0.6, noiseVal);
        alpha *= erosion;
        
        float distFromStart = vUv.y;
        float distFromEnd = currentLength - vUv.y;
        float startFade = smoothstep(0.0, min(0.12, currentLength * 0.35), distFromStart);
        float endFade = smoothstep(0.0, min(0.15, currentLength * 0.35), distFromEnd);
        alpha *= clamp(startFade * endFade + 0.15, 0.0, 1.0);

        gl_FragColor = vec4(uColor, alpha * uAlpha);
      }
    `;

    // Volumetric Fractal Raymarching Orb Shaders
    const fractalOrbVertexShader = `
      varying vec3 vLocalPosition;
      varying vec3 vNormal;
      varying vec3 vViewPosition;
      void main() {
        vLocalPosition = position;
        vNormal = normalize(normalMatrix * normal);
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vec4 mvCenter = modelViewMatrix * vec4(0.0, 0.0, 0.0, 1.0);
        vViewPosition = vec3(mvCenter.xy - mvPosition.xy, -mvPosition.z);
        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    const fractalOrbFragmentShader = `
      uniform float uTime;
      uniform vec3 uLocalCamPos;
      uniform vec3 uPrimaryColor;
      uniform vec3 uSecondaryColor;
      uniform float uDensity;
      uniform float uAlpha;
      uniform float uFractalIters;
      uniform float uFractalScale;
      uniform float uFractalDecay;
      uniform float uInternalAnim;
      uniform float uSmoothness;
      uniform float uAsymmetry;
      uniform float uRadius;
      
      varying vec3 vLocalPosition;
      varying vec3 vNormal;
      varying vec3 vViewPosition;

      float evaluateStructure(vec3 pos) {
        float densityAcc = 0.0;
        vec3 anchor = pos;
        
        float animTime = uTime * uInternalAnim;
        float s = sin(animTime);
        float c = cos(animTime);
        mat2 rotAnim = mat2(c, s, -s, c);

        float a = 0.5 * uAsymmetry;
        mat2 rotAsym1 = mat2(cos(a), sin(a), -sin(a), cos(a));
        float b = 0.3 * uAsymmetry;
        mat2 rotAsym2 = mat2(cos(b), sin(b), -sin(b), cos(b));
        
        for (int step = 0; step < 12; ++step) {
          if (float(step) >= uFractalIters) break;
          pos.xy *= rotAnim;
          pos.yz *= rotAnim;
          pos.xz *= rotAsym1;
          pos.yz *= rotAsym2;
          pos += vec3(0.05, -0.02, 0.03) * uAsymmetry;
          vec3 foldedPos = sqrt(pos * pos + uSmoothness);
          float magnitudeSq = max(dot(foldedPos, foldedPos), 0.00001);
          pos = (uFractalScale * foldedPos / magnitudeSq) - uFractalScale;
          float ySq = pos.y * pos.y;
          float zSq = pos.z * pos.z;
          pos.yz = vec2(ySq - zSq, 2.0 * pos.y * pos.z);
          pos = vec3(pos.z, pos.x, pos.y);
          densityAcc += exp(uFractalDecay * abs(dot(pos, anchor)));
        }
        return densityAcc * 0.5;
      }

      vec2 getVolumeBounds(vec3 origin, vec3 dir, float radius) {
        float b = dot(origin, dir);
        float c = dot(origin, origin) - radius * radius;
        float discriminant = b * b - c;
        if (discriminant < 0.0) return vec2(-1.0);
        float root = sqrt(discriminant);
        return vec2(-b - root, -b + root);
      }

      vec3 traceEnergy(vec3 origin, vec3 dir, vec2 limits, float radius) {
        float currentDepth = limits.x;
        float marchStep = (limits.y - limits.x) / 36.0;
        vec3 finalEnergy = vec3(0.0);
        float fieldVal = 0.0;
        float normScale = 2.0 / radius;
        
        for(int i = 0; i < 36; i++) {
          currentDepth += marchStep * exp(-1.5 * fieldVal);
          if(currentDepth > limits.y) break;
          vec3 samplePoint = origin + currentDepth * dir;
          fieldVal = evaluateStructure(samplePoint * normScale);
          vec3 currentGradient = mix(uSecondaryColor, uPrimaryColor, smoothstep(0.0, 0.4, fieldVal));
          vec3 emission = currentGradient * (fieldVal * 1.8 + fieldVal * fieldVal);
          finalEnergy = 0.99 * finalEnergy + (0.08 * uDensity) * emission;
        }
        return finalEnergy;
      }

      void main() {
        if (uAlpha < 0.005) discard;
        vec3 rayOrig = uLocalCamPos;
        vec3 rayDir = normalize(vLocalPosition - uLocalCamPos);
        
        float t = uTime * 0.1;
        float s = sin(t);
        float c = cos(t);
        mat2 rotXZ = mat2(c, s, -s, c);
        rayOrig.xz *= rotXZ;
        rayDir.xz *= rotXZ;

        vec2 limits = getVolumeBounds(rayOrig, rayDir, uRadius);
        if (limits.x < 0.0) discard;
        
        vec3 volumeColor = traceEnergy(rayOrig, rayDir, limits, uRadius);
        vec3 normal = normalize(vNormal);
        vec3 viewDir = normalize(vViewPosition);
        float facingRatio = max(dot(normal, viewDir), 0.0);
        float edgeAA = smoothstep(0.0, 0.08, facingRatio);
        vec3 finalColor = clamp(0.5 * log(1.0 + volumeColor), 0.0, 1.0);
        float maxLuma = max(finalColor.r, max(finalColor.g, finalColor.b));
        float minWhite = min(finalColor.r, min(finalColor.g, finalColor.b));
        finalColor = max(vec3(0.0), finalColor - vec3(minWhite * 0.70));
        finalColor = mix(finalColor * 1.35, uPrimaryColor * maxLuma * 1.35, 0.42) * edgeAA;
        
        float alpha = clamp(maxLuma * 1.65, 0.0, 1.0) * edgeAA * uAlpha;
        if (alpha < 0.005) discard;
        gl_FragColor = vec4(finalColor, alpha);
      }
    `;

    const atmosphereVertexShader = `
      varying vec3 vNormal;
      varying vec3 vViewPosition;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vec4 mvCenter = modelViewMatrix * vec4(0.0, 0.0, 0.0, 1.0);
        vViewPosition = vec3(mvCenter.xy - mvPosition.xy, -mvPosition.z);
        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    const atmosphereFragmentShader = `
      uniform vec3 uColor;
      uniform float uGlow;
      uniform float uLevel;
      uniform float uAlpha;
      varying vec3 vNormal;
      varying vec3 vViewPosition;
      void main() {
        if (uAlpha < 0.005) discard;
        vec3 normal = normalize(vNormal);
        vec3 viewDir = normalize(vViewPosition);
        float vdn = max(dot(normal, viewDir), 0.0);
        float edgeFade = smoothstep(0.0, 0.15, vdn);
        float innerFadePoint = clamp(1.0 - uLevel, 0.0, 0.99);
        float centerFade = smoothstep(1.0, innerFadePoint, vdn);
        float alpha = edgeFade * centerFade * uGlow * uAlpha;
        if (alpha < 0.005) discard;
        gl_FragColor = vec4(uColor * 1.4, alpha);
      }
    `;

        data[i * 4] = val;

      const texture = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
      texture.wrapS = THREE.RepeatWrapping;

      texture.needsUpdate = true;

    // =========================================================================
    // 3. SUMI-E 3D CATMULL-ROM RIBBON MESH GENERATION

    class SumiStrokeMesh {
      constructor(colorHex = 0xf5e4cf, baseWidth = 0.45) {
        this.baseWidth = baseWidth;
        this.maxPoints = 400;
        this.pointCount = 0;
        this.pathLength = 0;
        this.points = [];
        this.positions = new Float32Array(this.maxPoints * 2 * 3);
        this.uvs = new Float32Array(this.maxPoints * 2 * 2);
        this.indices = new Uint16Array(this.maxPoints * 6);

        this.geometry = new THREE.BufferGeometry();
        this.geometry.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));
        this.geometry.setAttribute('uv', new THREE.BufferAttribute(this.uvs, 2));
        this.geometry.setIndex(new THREE.BufferAttribute(this.indices, 1));

        this.uniforms = {
          uColor: { value: new THREE.Color(colorHex) },
          uTotalLength: { value: 0.0 },
          uProgress: { value: 1.0 },
          uTime: { value: 0.0 },
          uAlpha: { value: 1.0 }
        };

        this.material = new THREE.ShaderMaterial({
          vertexShader: sumiVertexShader,
          fragmentShader: sumiFragmentShader,
          uniforms: this.uniforms,
          transparent: true,
          side: THREE.DoubleSide,
          depthWrite: false
        });

        this.mesh = new THREE.Mesh(this.geometry, this.material);
        mainScene.add(this.mesh);
      }

      addPoint(p, widthScale = 1.0) {
        if (this.pointCount >= this.maxPoints - 1) return;
        let dir = new THREE.Vector3(0, 1, 0);
        let dist = 0.5;

        if (this.pointCount > 0) {
          const lastP = this.points[this.pointCount - 1];
          dir.subVectors(p, lastP);
          dist = dir.length();
          if (dist < 0.02) return;
          dir.normalize();
        }

        this.points.push(p.clone());
        this.pathLength += dist * 0.5;

        const up = new THREE.Vector3(0, 0, 1);
        let normal = new THREE.Vector3().crossVectors(dir, up).normalize();
        if (normal.lengthSq() < 0.001) normal.set(1, 0, 0);

        const w = this.baseWidth * widthScale;
        const left = p.clone().add(normal.clone().multiplyScalar(w * 0.5));
        const right = p.clone().sub(normal.clone().multiplyScalar(w * 0.5));

        const i = this.pointCount * 6;
        this.positions[i] = left.x;
        this.positions[i + 1] = left.y;
        this.positions[i + 2] = left.z;
        this.positions[i + 3] = right.x;
        this.positions[i + 4] = right.y;
        this.positions[i + 5] = right.z;

        const u = this.pointCount * 4;
        this.uvs[u] = 0;
        this.uvs[u + 1] = this.pathLength;
        this.uvs[u + 2] = 1;
        this.uvs[u + 3] = this.pathLength;

        if (this.pointCount > 0) {
          const idx = (this.pointCount - 1) * 6;
          const vIdx = (this.pointCount - 1) * 2;
          this.indices[idx] = vIdx;
          this.indices[idx + 1] = vIdx + 1;
          this.indices[idx + 2] = vIdx + 2;
          this.indices[idx + 3] = vIdx + 1;
          this.indices[idx + 4] = vIdx + 3;
          this.indices[idx + 5] = vIdx + 2;
        }

        this.pointCount++;
        this.uniforms.uTotalLength.value = this.pathLength;
        this.geometry.setDrawRange(0, Math.max(0, (this.pointCount - 1) * 6));
        this.geometry.attributes.position.needsUpdate = true;
        this.geometry.attributes.uv.needsUpdate = true;
        if (this.geometry.index) this.geometry.index.needsUpdate = true;
      }
    }

    let mainTrunkStroke = new SumiStrokeMesh(0xf5e4cf, 0.70);
    let branchStroke1 = new SumiStrokeMesh(0xf5e4cf, 0.44);
    let branchStroke2 = new SumiStrokeMesh(0xf5e4cf, 0.40);

    const trunkCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0.0, -9.2, 0.0),
      new THREE.Vector3(-0.6, -5.5, 0.2),
      new THREE.Vector3(0.8, -1.8, -0.1),
      new THREE.Vector3(-0.3, 2.2, 0.1),
      new THREE.Vector3(0.5, 5.8, 0.0)
    ]);

    const branchCurve1 = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-0.6, -5.5, 0.2),
      new THREE.Vector3(-3.2, -3.2, 0.3),
      new THREE.Vector3(-5.8, -1.4, 0.1),
      new THREE.Vector3(-7.8, 0.2, 0.0)
    ]);

    const branchCurve2 = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0.8, -1.8, -0.1),
      new THREE.Vector3(3.6, 0.2, 0.2),
      new THREE.Vector3(6.2, 1.8, 0.1),
      new THREE.Vector3(8.2, 3.1, -0.1)
    ]);

    function buildTree() {
      const trunkPts = trunkCurve.getPoints(90);
      trunkPts.forEach((p, idx) => {
        const widthScale = 1.0 - (idx / trunkPts.length) * 0.55;
        mainTrunkStroke.addPoint(p, widthScale);
      });

      const b1Pts = branchCurve1.getPoints(60);
      b1Pts.forEach((p, idx) => {
        const widthScale = 0.9 - (idx / b1Pts.length) * 0.5;
        branchStroke1.addPoint(p, widthScale);
      });

      const b2Pts = branchCurve2.getPoints(60);
      b2Pts.forEach((p, idx) => {
        const widthScale = 0.85 - (idx / b2Pts.length) * 0.5;
        branchStroke2.addPoint(p, widthScale);
      });
    }
    buildTree();

    // =========================================================================
    // 4. VOLUMETRIC FRACTAL RAYMARCHING ORBS (PLEXUS 1:1)
    // =========================================================================

    const FRACTAL_PRESETS = {
      pink: { primary: '#ff1a8c', secondary: '#ff99e6', density: 3.0, atmosphereGlow: 1.5 },
      blue: { primary: '#00b3ff', secondary: '#6e00ff', density: 3.0, atmosphereGlow: 1.5 },
      green: { primary: '#00e575', secondary: '#0055ff', density: 3.0, atmosphereGlow: 1.5 },
      yellow: { primary: '#ff9900', secondary: '#ffea00', density: 3.0, atmosphereGlow: 1.5 }
    };

    class VolumetricOrbMesh {
      constructor(colorKey, x, y, z, radius = 2.1) {
        this.colorKey = colorKey;
        this.preset = FRACTAL_PRESETS[colorKey];
        this.x = x;
        this.y = y;
        this.z = z;
        this.radius = radius;
        this.glowPulse = 0.0;

        const sphereGeom = new THREE.SphereGeometry(radius, 32, 32);
        this.material = new THREE.ShaderMaterial({
          vertexShader: fractalOrbVertexShader,
          fragmentShader: fractalOrbFragmentShader,
          uniforms: {
            uTime: { value: Math.random() * 10 },
            uLocalCamPos: { value: new THREE.Vector3(0, 0, 24) },
            uPrimaryColor: { value: new THREE.Color(this.preset.primary) },
            uSecondaryColor: { value: new THREE.Color(this.preset.secondary) },
            uDensity: { value: this.preset.density },
            uAlpha: { value: 1.0 },
            uFractalIters: { value: 4 },
            uFractalScale: { value: 0.95 },
            uFractalDecay: { value: -16.7 },
            uInternalAnim: { value: 0.55 },
            uSmoothness: { value: 0.031 },
            uAsymmetry: { value: 0.48 },
            uRadius: { value: radius }
          },
          transparent: true,
          side: THREE.FrontSide,
          depthWrite: false
        });

        this.mesh = new THREE.Mesh(sphereGeom, this.material);
        this.mesh.position.set(x, y, z);

        const haloGeom = new THREE.SphereGeometry(radius * 1.25, 24, 24);
        this.haloMat = new THREE.ShaderMaterial({
          vertexShader: atmosphereVertexShader,
          fragmentShader: atmosphereFragmentShader,
          uniforms: {
            uColor: { value: new THREE.Color(this.preset.primary) },
            uGlow: { value: this.preset.atmosphereGlow },
            uLevel: { value: 1.0 },
            uAlpha: { value: 1.0 }
          },
          transparent: true,
          side: THREE.BackSide,
          depthWrite: false
        });
        this.haloMesh = new THREE.Mesh(haloGeom, this.haloMat);
        this.mesh.add(this.haloMesh);

        mainScene.add(this.mesh);
      }

      update(time, delta) {
        this.material.uniforms.uTime.value += delta * 0.6;
        this.mesh.rotation.y += delta * 0.4;
        this.mesh.rotation.x += delta * 0.2;

        if (this.glowPulse > 0.01) {
          this.haloMat.uniforms.uGlow.value = this.preset.atmosphereGlow + this.glowPulse * 3.5;
          this.glowPulse -= delta * 0.85;
        } else {
          this.haloMat.uniforms.uGlow.value = this.preset.atmosphereGlow;
        }
      }
    }

    const volumetricOrbs = [

    // =========================================================================

      impulseDuration = 3.0;
      telemetryMode.innerText = 'Impuls 4: Heartbeat';
      infoText.innerText = 'Die gesamte Szene kontrahiert rhythmisch um 3-5% (60→130 BPM Herzschlag) während des Haltens vor dem Finale.';
    }

    // --- TRIGGER 5: PLEXUS SYNAPTIC WEB (1.4s) ---
    function triggerImpulse5() {
      setActiveButton('btn-impulse-5');
      currentActiveImpulse = 'PLEXUS_DOCK';
      impulseTime = 0.0;
      impulseDuration = 1.4;
      telemetryMode.innerText = 'Plexus: Synaptic Web';
      infoText.innerText = 'Andocken entlädt 550px Filament-Web mit 35Hz Interferenz-Flackern und sanftem Echo benachbarter Orbs.';

      const primaryOrb = volumetricOrbs[0];
      primaryOrb.glowPulse = 1.0;

      setTimeout(() => { volumetricOrbs[1].glowPulse = 0.75; }, 150);
      setTimeout(() => { volumetricOrbs[2].glowPulse = 0.65; }, 280);

      const lineCount = 24;
      for (let i = 0; i < lineCount; i++) {
        let targetPos = new THREE.Vector3();
        if (i < 3) {
          targetPos.copy(volumetricOrbs[i + 1].mesh.position);
        } else {
          const angle = (i / lineCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
          const dist = 7 + Math.random() * 6;
          targetPos.set(
            primaryOrb.x + Math.cos(angle) * dist,
            primaryOrb.y + Math.sin(angle) * dist,
            primaryOrb.z + (Math.random() - 0.5) * 4
          );
        }

        const vIdx = i * 6;
        synapticPositions[vIdx] = primaryOrb.x;
        synapticPositions[vIdx + 1] = primaryOrb.y;
        synapticPositions[vIdx + 2] = primaryOrb.z;

        synapticPositions[vIdx + 3] = targetPos.x;
        synapticPositions[vIdx + 4] = targetPos.y;
        synapticPositions[vIdx + 5] = targetPos.z;

        const c = new THREE.Color(0x00f0ff);
        synapticColors[vIdx] = 1.0;
        synapticColors[vIdx + 1] = 0.2;
        synapticColors[vIdx + 2] = 0.6;
        synapticColors[vIdx + 3] = c.r;
        synapticColors[vIdx + 4] = c.g;
        synapticColors[vIdx + 5] = c.b;
      }

      synapticGeom.setDrawRange(0, lineCount * 2);
      synapticGeom.attributes.position.needsUpdate = true;
      synapticGeom.attributes.color.needsUpdate = true;
    }

    // --- FULL SUMI-E SEQUENCE FLOW ---
    let sequenceTimeout = null;
    function triggerFullSequence() {
      clearTimeout(sequenceTimeout);
      setActiveButton('btn-impulse-seq');
      telemetryMode.innerText = 'Flow: 1/4 Tusche-Atem';
      triggerImpulse1();

      sequenceTimeout = setTimeout(() => {
        telemetryMode.innerText = 'Flow: 2/4 8 Farbknoten';
        triggerImpulse2();

        sequenceTimeout = setTimeout(() => {
          telemetryMode.innerText = 'Flow: 3/4 Rand-Aura';
          triggerImpulse3();

          sequenceTimeout = setTimeout(() => {
            telemetryMode.innerText = 'Flow: 4/4 Heartbeat';
            triggerImpulse4();

            sequenceTimeout = setTimeout(() => {
              telemetryMode.innerText = 'Flow Beendet';
              infoText.innerText = 'Sequenz erfolgreich abgeschlossen. Bereit für nächste Tests.';
              clearActiveButtons();
            }, 3200);
          }, 3200);
        }, 3200);
      }, 3200);
    }

    function resetAll() {
      clearTimeout(sequenceTimeout);
      clearActiveButtons();
      currentActiveImpulse = null;
      impulseTime = 0.0;
      mainTrunkStroke.uniforms.uProgress.value = 1.0;
      branchStroke1.uniforms.uProgress.value = 1.0;
      branchStroke2.uniforms.uProgress.value = 1.0;
      bgUniforms.uBgDim.value = 1.0;
      emberMat.opacity = 0.0;
      synapticMat.opacity = 0.0;
      sceneContainer.style.transform = 'scale(1.0)';
      chromaticFringe.style.opacity = '0';
      colorPaletteBar.classList.remove('visible');

      while (inhaleMeshGroup.children.length > 0) inhaleMeshGroup.remove(inhaleMeshGroup.children[0]);
      while (sporeMeshGroup.children.length > 0) sporeMeshGroup.remove(sporeMeshGroup.children[0]);

      inhaleParticles3D = [];
      sporeNodes3D = [];
      sporeDust3D = [];
      volumetricOrbs.forEach(o => o.glowPulse = 0.0);
      telemetryMode.innerText = 'Bereit';
      telemetryTimer.innerText = '3.0s';
      infoText.innerText = 'Szene zurückgesetzt. Wähle einen Impuls zum Testen.';
    }

    function setActiveButton(btnId) {
      clearActiveButtons();
      const b = document.getElementById(btnId);
      if (b) b.classList.add('active');
    }
    function clearActiveButtons() {
      document.querySelectorAll('.impulse-btn').forEach(b => b.classList.remove('active'));
    }

    // =========================================================================
    // 6. MAIN 60 FPS RENDER LOOP
    // =========================================================================

    let lastTime = performance.now();
    let frameCount = 0;
    let fpsTimer = 0;

    function animate(now) {
      requestAnimationFrame(animate);

      const delta = Math.min((now - lastTime) / 1000, 0.06);
      lastTime = now;

      frameCount++;
      fpsTimer += delta;
      if (fpsTimer >= 1.0) {
        document.getElementById('fps-counter').innerText = `${frameCount} FPS`;
        frameCount = 0;
        fpsTimer = 0;
      }

      bgUniforms.iTime.value += delta;
      mainTrunkStroke.uniforms.uTime.value += delta;
      branchStroke1.uniforms.uTime.value += delta;
      branchStroke2.uniforms.uTime.value += delta;

      volumetricOrbs.forEach(orb => orb.update(now * 0.001, delta));

      if (currentActiveImpulse) {
        impulseTime += delta;
        const remaining = Math.max(0, impulseDuration - impulseTime);
        telemetryTimer.innerText = `${remaining.toFixed(1)}s`;

        // 1. Inhale
        if (currentActiveImpulse === 'INHALE') {
          const p = Math.min(1.0, impulseTime / impulseDuration);
          
          if (p < 0.4) {
            bgUniforms.uBgDim.value = THREE.MathUtils.lerp(1.0, 0.88, p / 0.4);
            emberMat.opacity = (p / 0.4) * 0.95;
            emberMesh.scale.setScalar(1.0 + Math.sin(p * 15.0) * 0.35);
          } else if (p > 0.75) {
            bgUniforms.uBgDim.value = THREE.MathUtils.lerp(0.88, 1.0, (p - 0.75) / 0.25);
            emberMat.opacity = (1.0 - (p - 0.75) / 0.25) * 0.95;
          }

          inhaleParticles3D.forEach(pt => {
            const moveProg = Math.min(1.0, p * 1.6 * pt.speed);
            const dist = 1.0 - moveProg;
            const spiral = pt.spiralAngle + (p * 6.0);
            pt.current.x = pt.target.x + Math.cos(spiral) * (pt.start.x - pt.target.x) * dist;
            pt.current.y = pt.target.y + Math.sin(spiral) * (pt.start.y - pt.target.y) * dist;
            pt.current.z = pt.target.z + (pt.start.z - pt.target.z) * dist;
            pt.mesh.position.copy(pt.current);
            pt.mesh.scale.setScalar(dist * 1.1);
          });

          if (p > 0.38) {
            const growthProg = Math.min(1.0, (p - 0.38) / 0.62);
            mainTrunkStroke.uniforms.uProgress.value = growthProg;
            if (growthProg > 0.5) {
              const bProg = (growthProg - 0.5) / 0.5;
              branchStroke1.uniforms.uProgress.value = bProg;
              branchStroke2.uniforms.uProgress.value = bProg;
            }
          }
        }

        // 2. 8 Spores
        if (currentActiveImpulse === 'SPORES') {
          sporeNodes3D.forEach(node => {
            if (impulseTime >= node.bornTime && !node.hasDispersed) {
              const age = impulseTime - node.bornTime;
              if (age < 0.75) {
                const s = Math.sin(age * Math.PI / 0.75);
                node.mesh.material.opacity = s * 0.95;
                node.mesh.scale.setScalar(1.0 + s * 0.8);
              } else {
                node.hasDispersed = true;
                node.mesh.material.opacity = 0.0;

                const dustGeom = new THREE.SphereGeometry(0.12, 8, 8);
                for (let d = 0; d < 24; d++) {
                  const vel = new THREE.Vector3(
                    (Math.random() - 0.5) * 4.5,
                    (Math.random() - 0.2) * 5.0,
                    (Math.random() - 0.5) * 4.5
                  );
                  const dMat = new THREE.MeshBasicMaterial({ color: node.color, transparent: true, opacity: 0.9 });
                  const dMesh = new THREE.Mesh(dustGeom, dMat);
                  dMesh.position.copy(node.pos);
                  sporeMeshGroup.add(dMesh);

                  sporeDust3D.push({
                    mesh: dMesh,
                    vel: vel,
                    life: 1.6 + Math.random() * 0.5,
                    maxLife: 2.1
                  });
                }
              }
            }
          });

          if (impulseTime > 1.8) {
            colorPaletteBar.classList.add('visible');
          }
        }

        // 3. Chromatic Fringe
        if (currentActiveImpulse === 'FRINGE') {
          const p = impulseTime / impulseDuration;
          const flicker = 0.75 + 0.25 * Math.sin(impulseTime * 35.0);
          const envelope = Math.sin(p * Math.PI);
          chromaticFringe.style.opacity = (envelope * flicker * 0.95).toString();
        }

        // 4. Heartbeat
        if (currentActiveImpulse === 'HEARTBEAT') {
          const p = Math.min(1.0, impulseTime / impulseDuration);
          const currentBpm = 60 + (130 - 60) * Math.pow(p, 1.4);
          const freqHz = currentBpm / 60;
          const cycle = (impulseTime * freqHz) % 1.0;
          let beatAmp = 0.0;
          if (cycle < 0.18) {
            beatAmp = Math.sin((cycle / 0.18) * Math.PI) * 0.042;
          } else if (cycle > 0.25 && cycle < 0.42) {
            beatAmp = Math.sin(((cycle - 0.25) / 0.17) * Math.PI) * 0.026;
          }
          const scale = 1.0 - beatAmp;
          sceneContainer.style.transform = `scale(${scale})`;
        }

        // 5. Plexus Synaptic Web
        if (currentActiveImpulse === 'PLEXUS_DOCK') {
          const p = impulseTime / impulseDuration;
          const decay = Math.max(0, 1.0 - p);
          const flicker = 0.65 + 0.35 * Math.sin(impulseTime * 35.0);
          synapticMat.opacity = decay * flicker * 0.85;
        }

        if (impulseTime >= impulseDuration) {
          if (currentActiveImpulse === 'HEARTBEAT') sceneContainer.style.transform = 'scale(1.0)';
          if (currentActiveImpulse === 'FRINGE') chromaticFringe.style.opacity = '0';
          if (currentActiveImpulse === 'INHALE') {
            bgUniforms.uBgDim.value = 1.0;
            emberMat.opacity = 0.0;
          }
          if (currentActiveImpulse === 'PLEXUS_DOCK') synapticMat.opacity = 0.0;
          currentActiveImpulse = null;
        }
      }

      // Update Spore Dust Particle Simulation
      for (let i = sporeDust3D.length - 1; i >= 0; i--) {
        const dust = sporeDust3D[i];
        dust.mesh.position.addScaledVector(dust.vel, delta);
        dust.life -= delta;
        dust.mesh.material.opacity = Math.max(0, dust.life / dust.maxLife);
        if (dust.life <= 0) {
          sporeMeshGroup.remove(dust.mesh);
          sporeDust3D.splice(i, 1);
        }
      }

      renderer.clear();
      renderer.render(bgScene, bgCamera);
      renderer.render(mainScene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
