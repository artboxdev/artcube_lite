<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sakuraverse — Plexus Artistic Impulses Preview</title>
  
  <!-- Exo 2 Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

  <!-- Three.js r128 CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050106;
      font-family: 'Exo 2', sans-serif;
      color: #ffffff;
      touch-action: none;
    }

    #scene-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      transform-origin: center center;
    }

    canvas#webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* Top HUD Header */
    .top-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      background: linear-gradient(180deg, rgba(5, 1, 6, 0.9) 0%, rgba(5, 1, 6, 0) 100%);
      pointer-events: none;
    }

    .brand-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #00f0ff, #ffffff, #ff80df);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .telemetry-pill {
      font-size: 11px;
      font-family: monospace;
      color: #00f0ff;
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid rgba(0, 240, 255, 0.35);
      padding: 4px 12px;
      border-radius: 999px;
      letter-spacing: 0.5px;
    }

    /* Prompt Banner */
    .prompt-banner {
      position: absolute;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 12, 28, 0.88);
      border: 1px solid rgba(0, 240, 255, 0.5);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 240, 255, 0.25);
      backdrop-blur-md;
      padding: 10px 24px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: #e0faff;
      letter-spacing: 0.5px;
      z-index: 10;
      pointer-events: none;
      transition: all 0.3s ease;
      text-align: center;
    }

    .prompt-banner.sakura {
      border-color: rgba(255, 42, 157, 0.6);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 42, 157, 0.35);
      color: #ffd6f0;
    }

    .prompt-banner.finale {
      border-color: rgba(255, 187, 0, 0.7);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 187, 0, 0.4);
      color: #fff6d6;
    }

    /* Bottom Control Bar */
    .bottom-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 10;
      padding: 10px 18px;
      border-radius: 24px;
      background: rgba(14, 9, 22, 0.92);
      border: 1px solid rgba(0, 240, 255, 0.35);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 240, 255, 0.2);

    .action-btn {
      padding: 9px 16px;

      text-transform: uppercase;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);

    .action-btn:hover {
      background: rgba(0, 240, 255, 0.18);
      border-color: rgba(0, 240, 255, 0.6);

    .action-btn.sakura {

    .action-btn.sakura:hover {

    }

    .action-btn.gold:hover {

    .action-btn.active {

    /* Hold Down Radial Ring Overlay */
    #hold-ring-svg {
      position: absolute;

      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;

    }

    .toast {
      position: absolute;
      bottom: 96px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.5);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 12px;
      color: #00f0ff;
      letter-spacing: 0.5px;
      z-index: 20;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
    }

    /* Spawn Modus Selector Bar */
    .spawn-style-bar {
      position: absolute;
      top: 118px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      z-index: 10;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(15, 8, 24, 0.90);
      border: 1px solid rgba(255, 42, 157, 0.45);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.75), 0 0 20px rgba(255, 42, 157, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      max-width: 95vw;
    }

    .style-bar-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ff80df;
      margin-right: 4px;
      text-transform: uppercase;
    }

    .style-pill {
      padding: 5px 11px;
      border-radius: 999px;
      font-family: 'Exo 2', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.06);
      color: #e0d0f0;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
    }

    .style-pill:hover {
      background: rgba(255, 42, 157, 0.22);
      border-color: rgba(255, 42, 157, 0.6);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .style-pill.active {
      background: linear-gradient(135deg, #ff2a9d, #9b00e8);
      border-color: #ff80df;
      color: #ffffff;
      box-shadow: 0 0 16px rgba(255, 42, 157, 0.7);
    }

    .style-pill.sakura-toggle {
      border-color: rgba(0, 240, 255, 0.45);
      background: rgba(0, 240, 255, 0.12);
      color: #00f0ff;

    }

    .style-pill.sakura-toggle.active {
      background: linear-gradient(135deg, #00f0ff, #0088ff);
      border-color: #00f0ff;
      color: #ffffff;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.7);
    }
  </style>

<body>

  <div id="scene-container">
    <canvas id="webgl-canvas"></canvas>
    
    <svg id="hold-ring-svg">
      <circle id="hold-circle" cx="-100" cy="-100" r="32" fill="none" stroke="#ff2a9d" stroke-width="3" stroke-dasharray="201" stroke-dashoffset="201" stroke-linecap="round" opacity="0"></circle>
    </svg>
  </div>

  <!-- Header Telemetry -->
  <header class="top-header">
    <div class="brand-badge">
      <span class="brand-title">Plexus · Artistic Impulses Testbed</span>
    </div>
    <div class="telemetry-pill" id="telemetry">
      DOCK: 0/6 · FPS: 60 · IDLE
    </div>
  </header>

  <!-- Prompt Banner -->
  <div class="prompt-banner" id="prompt-banner">
    Halte gedrückt (1.5s), um ein stark flackerndes Sakura-Netzwerk zu erschaffen!
  </div>

  <!-- Spawn-Modus: 6 Netzwerk-Stile -->
  <div class="spawn-style-bar" id="spawn-style-bar">
    <span class="style-bar-label">SPAWN-MODUS:</span>
    <button class="style-pill active" data-style="1">1. Electric Arcs</button>

  <!-- Bottom Control Bar -->
  <footer class="bottom-bar">

  <script>
    /* =========================================================================
       PLEXUS ARTISTIC IMPULSES TESTBED (1:1 ARCHITECTURE AUS SAKURACANVAS.TSX)
       ========================================================================= */

    const container = document.getElementById('scene-container');
    const canvas = document.getElementById('webgl-canvas');
    const telemetry = document.getElementById('telemetry');
    const promptBanner = document.getElementById('prompt-banner');
    const toast = document.getElementById('toast');
    const holdCircle = document.getElementById('hold-circle');

    function showToastMsg(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // Three.js Core
    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 0, 420);

    // ==========================================
    // 1. BACKGROUND SHADER (Sakuraverse Ambient Vignette)
    // ==========================================
    const bgVertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `;

    const bgFragmentShader = `
      uniform float uTime;
      uniform vec2 uResolution;
      uniform float uBgDim;
      uniform float uRippleActive;
      uniform float uRippleTime;
      varying vec2 vUv;

      void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution.xy) / min(uResolution.x, uResolution.y);
        float dist = length(uv);

        // Cyber Magenta / Deep Midnight Vignette
        vec3 colCenter = vec3(0.06, 0.02, 0.08);
        vec3 colMid = vec3(0.03, 0.01, 0.04);
        vec3 colEdge = vec3(0.012, 0.005, 0.018);

        vec3 bg = mix(colCenter, colMid, smoothstep(0.0, 0.8, dist));
        bg = mix(bg, colEdge, smoothstep(0.6, 1.4, dist));

        // Pulsing Soft Glow Aura
        float pulse = 0.5 + 0.5 * sin(uTime * 0.45);
        bg += vec3(0.04, 0.01, 0.06) * pulse * (1.0 - smoothstep(0.0, 0.9, dist));

        // Shockwave Ripple
        if (uRippleActive > 0.5) {
          float ripR = uRippleTime * 0.75;
          float ripThickness = 0.08;
          float ring = smoothstep(ripR - ripThickness, ripR, dist) - smoothstep(ripR, ripR + ripThickness, dist);
          float ripFade = clamp(1.0 - (uRippleTime / 2.5), 0.0, 1.0);
          bg += vec3(0.15, 0.02, 0.18) * ring * ripFade * 1.5;
        }

        bg *= uBgDim;
        gl_FragColor = vec4(bg, 1.0);
      }
    `;

    const bgUniforms = {
      uTime: { value: 0.0 },
      uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      uBgDim: { value: 1.0 },
      uRippleActive: { value: 0.0 },
      uRippleTime: { value: 0.0 }
    };

    const bgScene = new THREE.Scene();
    const bgCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const bgMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(2, 2),
      new THREE.ShaderMaterial({
        vertexShader: bgVertexShader,
        fragmentShader: bgFragmentShader,
        uniforms: bgUniforms,
        depthWrite: false,
        depthTest: false
      })
    );
    bgScene.add(bgMesh);

    // ==========================================
    // 2. FRACTAL ORBS SHADERS & PALETTES
    // ==========================================
    const fractalOrbVertexShader = `
      varying vec3 vLocalPosition;
      varying vec3 vNormal;
      varying vec3 vViewPosition;

      void main() {
        vLocalPosition = position;
        vNormal = normalize(normalMatrix * normal);
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vec4 mvCenter = modelViewMatrix * vec4(0.0, 0.0, 0.0, 1.0);
        vViewPosition = vec3(mvCenter.xy - mvPosition.xy, -mvPosition.z);
        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    const fractalOrbFragmentShader = `
      uniform float uTime;
      uniform vec3 uLocalCamPos;
      uniform vec3 uPrimaryColor;
      uniform vec3 uSecondaryColor;
      uniform float uDensity;
      uniform float uAlpha;
      uniform float uFractalIters;
      uniform float uFractalScale;
      uniform float uFractalDecay;
      uniform float uInternalAnim;
      uniform float uSmoothness;
      uniform float uAsymmetry;
      uniform float uRadius;

      varying vec3 vLocalPosition;
      varying vec3 vNormal;
      varying vec3 vViewPosition;

      float evaluateStructure(vec3 pos) {
        float densityAcc = 0.0;
        vec3 anchor = pos;
        float animTime = uTime * uInternalAnim;
        float s = sin(animTime);
        float c = cos(animTime);
        mat2 rotAnim = mat2(c, s, -s, c);

        float a = 0.5 * uAsymmetry;
        mat2 rotAsym1 = mat2(cos(a), sin(a), -sin(a), cos(a));
        float b = 0.3 * uAsymmetry;
        mat2 rotAsym2 = mat2(cos(b), sin(b), -sin(b), cos(b));

        for (int step = 0; step < 8; ++step) {
          if (float(step) >= uFractalIters) break;
          pos.xy *= rotAnim;
          pos.yz *= rotAnim;
          pos.xz *= rotAsym1;
          pos.yz *= rotAsym2;
          pos += vec3(0.05, -0.02, 0.03) * uAsymmetry;
          vec3 foldedPos = sqrt(pos * pos + uSmoothness);
          float magnitudeSq = max(dot(foldedPos, foldedPos), 0.00001);
          pos = (uFractalScale * foldedPos / magnitudeSq) - uFractalScale;
          float ySq = pos.y * pos.y;
          float zSq = pos.z * pos.z;
          pos.yz = vec2(ySq - zSq, 2.0 * pos.y * pos.z);
          pos = vec3(pos.z, pos.x, pos.y);
          densityAcc += exp(uFractalDecay * abs(dot(pos, anchor)));
        }
        return densityAcc * 0.5;
      }

      vec2 getVolumeBounds(vec3 origin, vec3 dir, float radius) {
        float b = dot(origin, dir);
        float c = dot(origin, origin) - radius * radius;
        float disc = b * b - c;
        if (disc < 0.0) return vec2(-1.0);
        float root = sqrt(disc);
        return vec2(-b - root, -b + root);
      }

      vec3 traceEnergy(vec3 origin, vec3 dir, vec2 limits, float radius) {
        float currentDepth = limits.x;
        float marchStep = (limits.y - limits.x) / 36.0;
        vec3 finalEnergy = vec3(0.0);
        float fieldVal = 0.0;
        float normScale = 2.0 / radius;

        for(int i = 0; i < 36; i++) {
          currentDepth += marchStep * exp(-1.5 * fieldVal);
          if(currentDepth > limits.y) break;
          vec3 samplePoint = origin + currentDepth * dir;
          fieldVal = evaluateStructure(samplePoint * normScale);
          float gradientBlend = smoothstep(0.0, 0.4, fieldVal);
          vec3 currentGradient = mix(uSecondaryColor, uPrimaryColor, gradientBlend);
          vec3 emission = currentGradient * (fieldVal * 1.8 + fieldVal * fieldVal * 1.0);
          finalEnergy = 0.99 * finalEnergy + (0.08 * uDensity) * emission;
        }
        return finalEnergy;
      }

      void main() {
        if (uAlpha < 0.005) discard;
        vec3 rayOrig = uLocalCamPos;
        vec3 rayDir = normalize(vLocalPosition - uLocalCamPos);
        float t = uTime * 0.1;
        float s = sin(t), c = cos(t);
        mat2 rotXZ = mat2(c, s, -s, c);
        rayOrig.xz *= rotXZ;
        rayDir.xz *= rotXZ;

        vec2 limits = getVolumeBounds(rayOrig, rayDir, uRadius);
        if (limits.x < 0.0) discard;

        vec3 volumeColor = traceEnergy(rayOrig, rayDir, limits, uRadius);
        vec3 normal = normalize(vNormal);
        vec3 viewDir = normalize(vViewPosition);
        float facingRatio = max(dot(normal, viewDir), 0.0);
        float edgeAA = smoothstep(0.0, 0.08, facingRatio);

        vec3 finalColor = clamp(0.5 * log(1.0 + volumeColor), 0.0, 1.0);
        float maxLuma = max(finalColor.r, max(finalColor.g, finalColor.b));
        float minWhite = min(finalColor.r, min(finalColor.g, finalColor.b));
        finalColor = max(vec3(0.0), finalColor - vec3(minWhite * 0.70));
        finalColor = mix(finalColor * 1.35, uPrimaryColor * maxLuma * 1.35, 0.42) * edgeAA;

        float alpha = clamp(maxLuma * 1.65, 0.0, 1.0) * edgeAA * uAlpha;
        if (alpha < 0.005) discard;
        gl_FragColor = vec4(finalColor, alpha);
      }
    `;

    const atmosphereVertexShader = `
      varying vec3 vNormal;
      varying vec3 vViewPosition;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vec4 mvCenter = modelViewMatrix * vec4(0.0, 0.0, 0.0, 1.0);
        vViewPosition = vec3(mvCenter.xy - mvPosition.xy, -mvPosition.z);
        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    const atmosphereFragmentShader = `
      uniform vec3 uColor;
      uniform float uGlow;
      uniform float uLevel;
      uniform float uAlpha;
      varying vec3 vNormal;
      varying vec3 vViewPosition;

      void main() {
        if (uAlpha < 0.005) discard;
        vec3 normal = normalize(vNormal);
        vec3 viewDir = normalize(vViewPosition);
        float vdn = max(dot(normal, viewDir), 0.0);
        float edgeFade = smoothstep(0.0, 0.15, vdn);
        float innerFadePoint = clamp(1.0 - uLevel, 0.0, 0.99);
        float centerFade = smoothstep(1.0, innerFadePoint, vdn);
        float alpha = edgeFade * centerFade * uGlow * uAlpha;
        if (alpha < 0.005) discard;
        gl_FragColor = vec4(uColor * 1.4, alpha);
      }
    `;

    function generateStarCrossTexture(hexColorStr) {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 128;
      const ctx = c.getContext('2d');
      if (ctx) {
        const cx = 64, cy = 64;
        const rad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 56);
        rad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
        rad.addColorStop(0.25, hexColorStr + 'bb');
        rad.addColorStop(0.55, hexColorStr + '33');
        rad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = rad;
        ctx.fillRect(0, 0, 128, 128);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      return tex;
    }

    const FRACTAL_ORB_PRESETS = {
      pink: { primary: '#ff1a8c', secondary: '#ff99e6', density: 3.0, fractalIters: 4, fractalScale: 0.95, fractalDecay: -16.7, smoothness: 0.031, asymmetry: 0.48, atmosphereGlow: 1.5, atmosphereLevel: 1.0, atmosphereScale: 1.03 },
      blue: { primary: '#00b3ff', secondary: '#6e00ff', density: 3.0, fractalIters: 4, fractalScale: 0.95, fractalDecay: -16.7, smoothness: 0.031, asymmetry: 0.48, atmosphereGlow: 1.5, atmosphereLevel: 1.0, atmosphereScale: 1.03 },
      yellow: { primary: '#ffbb00', secondary: '#ff5500', density: 3.0, fractalIters: 4, fractalScale: 0.95, fractalDecay: -16.7, smoothness: 0.031, asymmetry: 0.48, atmosphereGlow: 1.1, atmosphereLevel: 1.0, atmosphereScale: 1.02 },
      green: { primary: '#00e676', secondary: '#00c853', density: 3.0, fractalIters: 4, fractalScale: 0.95, fractalDecay: -16.7, smoothness: 0.031, asymmetry: 0.48, atmosphereGlow: 0.85, atmosphereLevel: 1.0, atmosphereScale: 1.02 }
    };

    const SATURATED_PALETTES = {
      pink: [ { r: 1.0, g: 0.1, b: 0.6 }, { r: 1.0, g: 0.4, b: 0.8 }, { r: 1.0, g: 0.7, b: 0.9 } ],
      blue: [ { r: 0.0, g: 0.75, b: 1.0 }, { r: 0.2, g: 0.4, b: 1.0 }, { r: 0.4, g: 0.9, b: 1.0 } ],
      yellow: [ { r: 1.0, g: 0.75, b: 0.0 }, { r: 1.0, g: 0.5, b: 0.0 }, { r: 1.0, g: 0.9, b: 0.3 } ],
      green: [ { r: 0.0, g: 0.9, b: 0.45 }, { r: 0.2, g: 1.0, b: 0.6 }, { r: 0.0, g: 0.7, b: 0.3 } ]
    };

    const SAKURA_HOLD_PALETTE = [
      { r: 1.0, g: 0.16, b: 0.62 }, // #ff2a9d
      { r: 1.0, g: 0.50, b: 0.87 }, // #ff80df
      { r: 1.0, g: 0.71, b: 0.86 }, // #ffb5dc
      { r: 1.0, g: 0.85, b: 0.95 }
    ];

    const ORB_CONFIGS = [
      { id: 'pink', orbIndex: 0, name: 'Sakura Pink', homeX: -160, homeY: 85, orbitRx: 45, orbitRy: 30, speed: 0.35, phase: 0.0 },
      { id: 'blue', orbIndex: 1, name: 'Electric Cyan', homeX: 160, homeY: 85, orbitRx: 46, orbitRy: 30, speed: -0.32, phase: 1.6 },
      { id: 'yellow', orbIndex: 2, name: 'Golden Sun', homeX: -160, homeY: -85, orbitRx: 44, orbitRy: 28, speed: 0.30, phase: 3.2 },
      { id: 'green', orbIndex: 3, name: 'Emerald Jade', homeX: 160, homeY: -85, orbitRx: 45, orbitRy: 30, speed: -0.28, phase: 4.8 }
    ];

    // ==========================================
    // 3. FLOATING PLEXUS ORB CLASS
    // ==========================================
    class FloatingOrb {
      constructor(cfg) {
        this.id = cfg.id;
        this.orbIndex = cfg.orbIndex;
        this.name = cfg.name;
        this.homeX = cfg.homeX;
        this.homeY = cfg.homeY;
        this.orbitRx = cfg.orbitRx;
        this.orbitRy = cfg.orbitRy;
        this.speed = cfg.speed;
        this.phase = cfg.phase;
        this.orbitAngle = this.phase;

        this.x = this.homeX + Math.cos(this.orbitAngle) * this.orbitRx;
        this.y = this.homeY + Math.sin(this.orbitAngle) * this.orbitRy;
        this.z = 0;
        this.restX = this.x;
        this.restY = this.y;

        this.isDragged = false;
        this.attachedPlexusCount = 0;
        this.attachedNodes = [];
        this.internalTime = Math.random() * 10.0;
        this.dockWobbleTimer = 999.0;
        this.hoverWobbleTimer = 999.0;
        this.finaleVx = 0;
        this.finaleVy = 0;
        this.finaleNetworkCount = 0;
        this.inImpulse = false;
        this.impulseCooldown = 0.0;

        // Non-overlapping formation offsets around centroid (Requirement 2)
        const formationOffsets = [
          { x: -58.0, y: 58.0 },  // Pink (top-left)
          { x: 58.0, y: 58.0 },   // Blue (top-right)
          { x: -58.0, y: -58.0 }, // Yellow (bottom-left)
          { x: 58.0, y: -58.0 }   // Green (bottom-right)
        ];
        const fOffset = formationOffsets[this.orbIndex] || { x: 0, y: 0 };
        this.formationOffsetX = fOffset.x;
        this.formationOffsetY = fOffset.y;

        // Meshes
        const ORB_RADIUS = 24.0;
        const geom = new THREE.SphereGeometry(ORB_RADIUS, 48, 48);
        this.preset = FRACTAL_ORB_PRESETS[this.id];

        this.material = new THREE.ShaderMaterial({
          vertexShader: fractalOrbVertexShader,
          fragmentShader: fractalOrbFragmentShader,
          uniforms: {
            uTime: { value: this.internalTime },
            uLocalCamPos: { value: new THREE.Vector3(0, 0, 150) },
            uPrimaryColor: { value: new THREE.Color(this.preset.primary) },
            uSecondaryColor: { value: new THREE.Color(this.preset.secondary) },
            uDensity: { value: this.preset.density },
            uAlpha: { value: 1.0 },
            uFractalIters: { value: this.preset.fractalIters },
            uFractalScale: { value: this.preset.fractalScale },
            uFractalDecay: { value: this.preset.fractalDecay },
            uInternalAnim: { value: 0.43 },
            uSmoothness: { value: this.preset.smoothness },
            uAsymmetry: { value: this.preset.asymmetry },
            uRadius: { value: ORB_RADIUS }
          },
          transparent: true,
          side: THREE.DoubleSide,
          depthWrite: false,
          blending: THREE.NormalBlending
        });
        this.mesh = new THREE.Mesh(geom, this.material);
        this.mesh.position.set(this.x, this.y, this.z);
        scene.add(this.mesh);

        // Atmosphere Halo
        this.atmosphereMaterial = new THREE.ShaderMaterial({
          vertexShader: atmosphereVertexShader,
          fragmentShader: atmosphereFragmentShader,
          uniforms: {
            uColor: { value: new THREE.Color(this.preset.primary) },
            uGlow: { value: this.preset.atmosphereGlow },
            uLevel: { value: this.preset.atmosphereLevel },
            uAlpha: { value: 1.0 }
          },
          transparent: true,
          side: THREE.FrontSide,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });
        this.atmosphereMesh = new THREE.Mesh(geom, this.atmosphereMaterial);
        this.atmosphereMesh.scale.set(this.preset.atmosphereScale, this.preset.atmosphereScale, this.preset.atmosphereScale);
        this.mesh.add(this.atmosphereMesh);

        // Starburst Sprite
        const starTex = generateStarCrossTexture(this.preset.primary);
        const spriteMat = new THREE.SpriteMaterial({
          map: starTex,
          color: 0xffffff,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        this.starSprite = new THREE.Sprite(spriteMat);
        this.starSprite.scale.set(48, 48, 1);
        this.mesh.add(this.starSprite);
      }

      triggerDockWobble() {
        this.dockWobbleTimer = 0.0;
      }

      triggerHoverWobble() {
        this.hoverWobbleTimer = 0.0;
      }

      attachCluster(cluster) {
        this.attachedPlexusCount += 1;
        const tier = this.attachedPlexusCount;
        const layerRadius = 38.0 + (tier - 1) * 14.0;
        const speedMul = 1.0 + (tier % 2 === 0 ? 0.35 : -0.25);
        const palette = SATURATED_PALETTES[this.id] || SATURATED_PALETTES.pink;

        const count = (cluster && cluster.nodes && cluster.nodes.length) ? cluster.nodes.length : 12;
        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2 + Math.random() * 0.4;
          const elevation = (Math.random() - 0.5) * Math.PI * 0.6;
          const rgb = palette[i % palette.length];
          this.attachedNodes.push({
            radius: layerRadius + (Math.random() - 0.5) * 6.0,
            angle: angle,
            elevation: elevation,
            orbitSpeed: (0.45 + (i % 3) * 0.20) * (i % 2 === 0 ? 1 : -1) * speedMul,
            r: rgb.r,
            g: rgb.g,
            b: rgb.b,
            size: 15.0 + Math.random() * 8.0,
            tier: tier
          });
        }
      }

      update(delta, totalTime, isFinale, finaleAge) {
        this.internalTime += delta;
        this.material.uniforms.uTime.value = this.internalTime;

        // Update orbiting attached plexus satellites
        this.attachedNodes.forEach(node => {
          node.angle += node.orbitSpeed * delta;
        });

        if (this.impulseCooldown > 0) {
          this.impulseCooldown -= delta;
        }

        if (isFinale) {
          // Finale Drift / Interaction Movement
          this.x += this.finaleVx * delta;
          this.y += this.finaleVy * delta;
          this.finaleVx *= Math.max(0.0, 1.0 - delta * 2.2);
          this.finaleVy *= Math.max(0.0, 1.0 - delta * 2.2);
        } else if (isFormationActive) {
          // Synchronous Flocking Formation (Orbs liegen nicht übereinander, sondern schweben im Verbund!)
          const breath = Math.sin(totalTime * 2.2 + this.orbIndex * 1.5) * 5.0;
          const targetX = flockCenterX + this.formationOffsetX + Math.cos(totalTime * 1.5 + this.phase) * breath;
          const targetY = flockCenterY + this.formationOffsetY + Math.sin(totalTime * 1.5 + this.phase) * breath;
          this.x = THREE.MathUtils.lerp(this.x, targetX, delta * 3.2);
          this.y = THREE.MathUtils.lerp(this.y, targetY, delta * 3.2);
          this.z = Math.sin(totalTime * 1.8 + this.phase) * 6.0;
        } else if (this.isDragged) {
          // Follow pointer
          this.x = mouseWorld.x;
          this.y = mouseWorld.y;
        } else if (totalAttachedPlexus >= 6 && this.hasBeenPlaced) {
          // Pre-Finale placed at rest position
          this.x = THREE.MathUtils.lerp(this.x, this.restX, delta * 3.0);
          this.y = THREE.MathUtils.lerp(this.y, this.restY, delta * 3.0);
        } else {
          // Free Orbiting
          this.orbitAngle += this.speed * delta;
          this.x = this.homeX + Math.cos(this.orbitAngle) * this.orbitRx;
          this.y = this.homeY + Math.sin(this.orbitAngle) * this.orbitRy;
          this.z = Math.sin(this.orbitAngle * 1.5 + this.phase) * 12.0;
        }

        // Wobble Scaling
        let scaleX = 1.0, scaleY = 1.0, scaleZ = 1.0;
        if (this.dockWobbleTimer < 1.0) {
          this.dockWobbleTimer += delta;
          const t = Math.min(1.0, this.dockWobbleTimer / 1.0);
          const wobble = Math.sin(t * Math.PI * 10.0) * Math.exp(-t * 3.2);
          scaleX *= (1.0 + wobble * 0.36);
          scaleY *= (1.0 - wobble * 0.28);
          scaleZ *= (1.0 + wobble * 0.36);
        }
        if (this.hoverWobbleTimer < 0.4) {
          this.hoverWobbleTimer += delta;
          const ht = this.hoverWobbleTimer / 0.4;
          const hw = Math.sin(ht * Math.PI * 6.0) * (1.0 - ht) * 0.15;
          scaleX *= (1.0 + hw);
          scaleY *= (1.0 + hw);
        }

        this.mesh.scale.set(scaleX, scaleY, scaleZ);
        this.mesh.position.set(this.x, this.y, this.z);

        // Smooth 3D tumbling rotation of volumetric orb
        this.mesh.rotation.y += delta * 0.55;
        this.mesh.rotation.x += delta * 0.28;
        this.mesh.updateMatrixWorld();

        const localCam = new THREE.Vector3(
          this.mesh.position.x,
          this.mesh.position.y,
          this.mesh.position.z + 150.0
        );
        this.mesh.worldToLocal(localCam);
        this.material.uniforms.uLocalCamPos.value.copy(localCam);

        // Starburst rotation
        this.starSprite.material.rotation = totalTime * 0.5 + this.phase;
      }
    }

    const floatingOrbs = ORB_CONFIGS.map(cfg => new FloatingOrb(cfg));

    // ==========================================
    // 4. DYNAMIC GPU LINES & POINTS BUFFER
    // ==========================================
    const MAX_NODES = 1200;
    const MAX_LINES = 2500;

    const nodePos = new Float32Array(MAX_NODES * 3);
    const nodeCol = new Float32Array(MAX_NODES * 3);
    const nodeSize = new Float32Array(MAX_NODES);

    const linePos = new Float32Array(MAX_LINES * 6);
    const lineCol = new Float32Array(MAX_LINES * 6);

    const nodeGeo = new THREE.BufferGeometry();
    nodeGeo.setAttribute('position', new THREE.BufferAttribute(nodePos, 3));
    nodeGeo.setAttribute('color', new THREE.BufferAttribute(nodeCol, 3));
    nodeGeo.setAttribute('size', new THREE.BufferAttribute(nodeSize, 1));

    const nodeMat = new THREE.ShaderMaterial({
      uniforms: { uAlpha: { value: 1.0 } },
      vertexShader: `
        attribute float size;
        attribute vec3 color;
        varying vec3 vColor;
        void main() {
          vColor = color;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = size * (300.0 / -mvPosition.z);
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        uniform float uAlpha;
        varying vec3 vColor;
        void main() {
          vec2 p = gl_PointCoord - vec2(0.5);
          float d = length(p);
          if (d > 0.5) discard;
          float starVal = pow(clamp(1.0 - abs(p.x) * 2.0, 0.0, 1.0) * clamp(1.0 - abs(p.y) * 2.0, 0.0, 1.0), 2.5);
          float softCore = exp(-d * d * 14.0);
          float intensity = max(starVal * 2.2, softCore * 1.8);
          vec3 brightColor = clamp(vColor * 1.15 + vec3(0.04) * starVal, 0.0, 1.0);
          gl_FragColor = vec4(brightColor, clamp(intensity * 1.15 * uAlpha, 0.0, 1.0));
        }
      `,
      transparent: true,
      blending: THREE.NormalBlending,
      depthWrite: false
    });
    const pointsMesh = new THREE.Points(nodeGeo, nodeMat);
    scene.add(pointsMesh);

    const lineGeo = new THREE.BufferGeometry();
    lineGeo.setAttribute('position', new THREE.BufferAttribute(linePos, 3));
    lineGeo.setAttribute('color', new THREE.BufferAttribute(lineCol, 3));
    const lineMat = new THREE.LineBasicMaterial({
      vertexColors: true,
      transparent: true,
      opacity: 0.95,
      blending: THREE.NormalBlending,
      depthWrite: false
    });
    const linesMesh = new THREE.LineSegments(lineGeo, lineMat);
    scene.add(linesMesh);

    // Flat structure for active scene nodes
    let activeNodeCount = 0;
    const worldX = new Float32Array(MAX_NODES);
    const worldY = new Float32Array(MAX_NODES);
    const worldZ = new Float32Array(MAX_NODES);
    const worldR = new Float32Array(MAX_NODES);
    const worldG = new Float32Array(MAX_NODES);
    const worldB = new Float32Array(MAX_NODES);
    const worldS = new Float32Array(MAX_NODES);
    const worldGrp = new Int16Array(MAX_NODES);
    const worldAlpha = new Float32Array(MAX_NODES);

    // ==========================================
    // 5. PLEXUS CLUSTERS & HOLD-DOWN STATE
    // ==========================================
    let totalAttachedPlexus = 0;
    let isMouseDown = false;
    let isHoldCharging = false;
    let holdTimer = 0.0;
    const HOLD_THRESHOLD = 1.5;
    let holdOrigin = { x: 0, y: 0 };
    let mouseWorld = new THREE.Vector3(0, 0, 0);

    // Spawn-Modus & Formation State (Requirement 1 & 2)
    let currentSpawnStyle = 1;
    let isContinuousTestActive = false;
    let isFormationActive = false;
    let flockAngle = 0.0;
    let flockCenterX = 0.0;
    let flockCenterY = 0.0;

    // Free floating or dragging plexus clusters
    const activeClusters = [];
    let draggedCluster = null;
    let draggedOrb = null;

    class DriftingCluster {
      constructor(x, y) {
        this.id = Math.random();
        this.x = x;
        this.y = y;
        this.z = 0;
        this.driftAngle = Math.random() * Math.PI * 2;
        this.driftSpeed = 12.0 + Math.random() * 10.0;
        this.nodes = [];
        for (let i = 0; i < 12; i++) {
          const ang = (i / 12) * Math.PI * 2;
          const rad = 25.0 + Math.random() * 25.0;
          this.nodes.push({
            relX: Math.cos(ang) * rad,
            relY: Math.sin(ang) * rad,
            relZ: (Math.random() - 0.5) * 15.0,
            color: SAKURA_HOLD_PALETTE[i % SAKURA_HOLD_PALETTE.length]
          });
        }
      }

      update(delta) {
        this.x += Math.cos(this.driftAngle) * this.driftSpeed * delta;
        this.y += Math.sin(this.driftAngle) * this.driftSpeed * delta;

        // Soft screen bounce
        if (Math.abs(this.x) > 280) this.driftAngle = Math.PI - this.driftAngle;
        if (Math.abs(this.y) > 160) this.driftAngle = -this.driftAngle;
      }
    }

    // ==========================================
    // 6. SPAWN-MODUS: 6 UNREGELMÄSSIGE NETZWERK-STILE
    // ==========================================
    // Basis-Arrays für Stil 1
    const holdNetworkCore = [];
    const CORE_NODE_COUNT = 24;
    for (let i = 0; i < CORE_NODE_COUNT; i++) {
      const angle = (i / CORE_NODE_COUNT) * Math.PI * 2 + Math.random() * 0.35;
      const baseR = 8.0 + Math.random() * 32.0;
      holdNetworkCore.push({
        angle,
        baseR,
        z: (Math.random() - 0.5) * 18.0,
        speed: (Math.random() > 0.5 ? 1 : -1) * (1.6 + Math.random() * 2.2),
        color: SAKURA_HOLD_PALETTE[i % SAKURA_HOLD_PALETTE.length]
      });
    }

    const holdTendrilBranches = [];
    const NUM_TENDRILS = 12;
    for (let b = 0; b < NUM_TENDRILS; b++) {
      const baseAngle = (b / NUM_TENDRILS) * Math.PI * 2 + (Math.random() - 0.5) * 0.32;
      const nodes = [];
      const segCount = 4;
      for (let s = 1; s <= segCount; s++) {
        const segR = 28.0 + s * 34.0 + (Math.random() - 0.5) * 14.0;
        nodes.push({
          angleOffset: (Math.random() - 0.5) * 0.28,
          baseR: segR,
          whipFreq: 16.0 + Math.random() * 16.0,
          whipPhase: Math.random() * Math.PI * 2,
          whipAmp: 7.0 + s * 7.5,
          z: (Math.random() - 0.5) * 25.0,
          color: SAKURA_HOLD_PALETTE[(b + s) % SAKURA_HOLD_PALETTE.length]
        });
      }
      holdTendrilBranches.push({
        baseAngle,
        spinSpeed: (b % 2 === 0 ? 1 : -1) * (0.65 + Math.random() * 0.75),
        nodes
      });
    }

    // Generator-Engine für alle 6 Stile (mit stark unregelmäßiger Bewegung um den Zeiger)
    function populateHoldNetwork(delta, totalTime, holdIntensity, originX, originY) {
      // 1. Unregelmäßige taumelnde Drift des Brennpunkts um den Cursor
      const driftX = Math.sin(totalTime * 3.4 + currentSpawnStyle * 1.7) * 18.0 
                   + Math.sin(totalTime * 8.9) * 8.0 
                   + Math.cos(totalTime * 17.3) * 3.5;
      const driftY = Math.cos(totalTime * 4.1 + currentSpawnStyle * 1.3) * 18.0 
                   + Math.sin(totalTime * 7.7) * 8.0 
                   + Math.sin(totalTime * 19.1) * 3.5;

      const cX = originX + driftX * (0.35 + 0.65 * holdIntensity);
      const cY = originY + driftY * (0.35 + 0.65 * holdIntensity);

      // Zentraler leuchtender Funke
      if (activeNodeCount < MAX_NODES) {
        const cIdx = activeNodeCount++;
        worldX[cIdx] = cX;
        worldY[cIdx] = cY;
        worldZ[cIdx] = 0.0;
        worldR[cIdx] = 1.0;
        worldG[cIdx] = 0.92;
        worldB[cIdx] = 0.98;
        worldS[cIdx] = (24.0 + Math.sin(totalTime * 22.0) * 6.0) * (0.4 + 0.6 * holdIntensity);
        worldGrp[cIdx] = 999;
        worldAlpha[cIdx] = holdIntensity;
      }

      if (currentSpawnStyle === 1) {
        // ==========================================
        // STIL 1: ELECTRIC ARCS & TENDRILS (Gezackte Hochspannungs-Entladungen)
        // ==========================================
        for (let i = 0; i < holdNetworkCore.length; i++) {
          if (activeNodeCount >= MAX_NODES) break;
          const cn = holdNetworkCore[i];
          cn.angle += cn.speed * delta;
          const r = cn.baseR * (0.35 + 0.65 * holdIntensity);
          const nx = cX + Math.cos(cn.angle) * r;
          const ny = cY + Math.sin(cn.angle) * r;
          const nz = cn.z * holdIntensity;

          const nIdx = activeNodeCount++;
          worldX[nIdx] = nx; worldY[nIdx] = ny; worldZ[nIdx] = nz;
          worldR[nIdx] = cn.color.r; worldG[nIdx] = cn.color.g; worldB[nIdx] = cn.color.b;
          worldS[nIdx] = (15.0 + Math.random() * 8.0) * (0.5 + 0.5 * holdIntensity);
          worldGrp[nIdx] = 999;
          worldAlpha[nIdx] = holdIntensity;
        }

        for (let b = 0; b < holdTendrilBranches.length; b++) {
          const br = holdTendrilBranches[b];
          br.baseAngle += br.spinSpeed * delta;
          for (let s = 0; s < br.nodes.length; s++) {
            if (activeNodeCount >= MAX_NODES) break;
            const tn = br.nodes[s];
            const whip = Math.sin(totalTime * tn.whipFreq + tn.whipPhase) * tn.whipAmp;
            const curAng = br.baseAngle + tn.angleOffset + (whip * 0.018);
            const curR = (tn.baseR + whip * 0.45) * (0.32 + 0.68 * Math.pow(holdIntensity, 0.55));

            const nx = cX + Math.cos(curAng) * curR;
            const ny = cY + Math.sin(curAng) * curR;
            const nz = tn.z * holdIntensity;

            const nIdx = activeNodeCount++;
            worldX[nIdx] = nx; worldY[nIdx] = ny; worldZ[nIdx] = nz;
            worldR[nIdx] = tn.color.r; worldG[nIdx] = tn.color.g; worldB[nIdx] = tn.color.b;
            worldS[nIdx] = (13.0 + (s === br.nodes.length - 1 ? 12.0 : 4.0)) * (0.4 + 0.6 * holdIntensity);
            worldGrp[nIdx] = 999;
            worldAlpha[nIdx] = holdIntensity;
          }
        }
      } else if (currentSpawnStyle === 2) {
        // ==========================================
        // STIL 2: CHAOTIC VORTEX SWARM (Asymmetrischer Spiral-Wirbel)
        // ==========================================
        const numVortexNodes = 58;
        for (let i = 0; i < numVortexNodes; i++) {
          if (activeNodeCount >= MAX_NODES) break;
          const arm = i % 4;
          const armOffset = (arm / 4) * Math.PI * 2;
          const tRel = (i / numVortexNodes);
          const spin = totalTime * (2.2 + arm * 0.4) + tRel * 14.0 + armOffset;
          // Unregelmäßiger, eiförmig verzerrter Spiralradius
          const eccentric = 1.0 + 0.45 * Math.sin(spin * 2.0 + totalTime * 3.0);
          const r = (14.0 + tRel * 160.0 * eccentric) * (0.3 + 0.7 * holdIntensity);
          const tiltX = Math.cos(totalTime * 1.5) * 0.25;
          const tiltY = Math.sin(totalTime * 1.8) * 0.25;

          const nx = cX + Math.cos(spin) * r * (1.0 + tiltX);
          const ny = cY + Math.sin(spin) * r * (0.85 + tiltY);
          const nz = Math.sin(spin * 3.0 + i) * 22.0 * holdIntensity;

          const col = SAKURA_HOLD_PALETTE[i % SAKURA_HOLD_PALETTE.length];
          const nIdx = activeNodeCount++;
          worldX[nIdx] = nx; worldY[nIdx] = ny; worldZ[nIdx] = nz;
          worldR[nIdx] = col.r; worldG[nIdx] = col.g; worldB[nIdx] = col.b;
          worldS[nIdx] = (14.0 + (1.0 - tRel) * 12.0) * (0.5 + 0.5 * holdIntensity);
          worldGrp[nIdx] = 999;
          worldAlpha[nIdx] = holdIntensity;
        }
      } else if (currentSpawnStyle === 3) {
        // ==========================================
        // STIL 3: NEURAL SYNAPSE WEB (Organische Dendriten-Verästelung)
        // ==========================================
        const numSynapses = 54;
        const pulseWave = (totalTime * 3.5) % (Math.PI * 2);
        for (let i = 0; i < numSynapses; i++) {
          if (activeNodeCount >= MAX_NODES) break;
          const trunk = Math.floor(i / 9);
          const trunkAngle = (trunk / 6) * Math.PI * 2 + Math.sin(totalTime * 2.0 + trunk) * 0.25;
          const step = (i % 9) + 1;
          const baseDist = step * 18.0;
          const twitch = Math.sin(totalTime * 18.0 + i * 2.7) * (step > 4 ? 12.0 : 4.0);
          const branchCurv = Math.cos(step * 0.8 + totalTime * 2.0) * (step * 3.5);

          const r = (baseDist + twitch) * (0.35 + 0.65 * holdIntensity);
          const a = trunkAngle + (branchCurv * 0.02);
          const nx = cX + Math.cos(a) * r;
          const ny = cY + Math.sin(a) * r;
          const nz = Math.sin(totalTime * 4.0 + step) * 16.0;

          const isFiring = Math.abs(Math.sin(pulseWave - step * 0.45)) > 0.88;
          const col = isFiring ? { r: 1.0, g: 0.9, b: 1.0 } : SAKURA_HOLD_PALETTE[i % SAKURA_HOLD_PALETTE.length];

          const nIdx = activeNodeCount++;
          worldX[nIdx] = nx; worldY[nIdx] = ny; worldZ[nIdx] = nz;
          worldR[nIdx] = col.r; worldG[nIdx] = col.g; worldB[nIdx] = col.b;
          worldS[nIdx] = (isFiring ? 22.0 : 13.0) * (0.4 + 0.6 * holdIntensity);
          worldGrp[nIdx] = 999;
          worldAlpha[nIdx] = holdIntensity;
        }
      } else if (currentSpawnStyle === 4) {
        // ==========================================
        // STIL 4: QUANTUM GLITCH & FRACTURE (Fraktale Gitter-Sprünge)
        // ==========================================
        const numGlitchNodes = 52;
        const glitchStepTime = Math.floor(totalTime * 7.5);
        for (let i = 0; i < numGlitchNodes; i++) {
          if (activeNodeCount >= MAX_NODES) break;
          const seed = (i * 127.3 + glitchStepTime * 43.1) % 1000.0;
          const rawAngle = ((Math.floor(seed % 8)) / 8.0) * Math.PI * 2;
          const rawDist = (20.0 + ((seed * 7.1) % 150.0)) * (0.3 + 0.7 * holdIntensity);
          const jitterX = (Math.sin(totalTime * 35.0 + i) > 0.6 ? 1 : -1) * 8.0;
          const jitterY = (Math.cos(totalTime * 40.0 + i * 1.5) > 0.6 ? 1 : -1) * 8.0;

          const nx = cX + Math.cos(rawAngle) * rawDist + jitterX;
          const ny = cY + Math.sin(rawAngle) * rawDist + jitterY;
          const nz = ((seed % 30) - 15.0) * holdIntensity;

          const col = SAKURA_HOLD_PALETTE[i % SAKURA_HOLD_PALETTE.length];
          const nIdx = activeNodeCount++;
          worldX[nIdx] = nx; worldY[nIdx] = ny; worldZ[nIdx] = nz;
          worldR[nIdx] = col.r; worldG[nIdx] = col.g; worldB[nIdx] = col.b;
          worldS[nIdx] = (16.0 + (i % 3 === 0 ? 8.0 : 0.0)) * (0.4 + 0.6 * holdIntensity);
          worldGrp[nIdx] = 999;
          worldAlpha[nIdx] = holdIntensity;
        }
      } else if (currentSpawnStyle === 5) {
        // ==========================================
        // STIL 5: SOLAR FLARE SPICULES (Eruptive Plasma-Schlingen)
        // ==========================================
        const numLoops = 9;
        const nodesPerLoop = 6;
        for (let l = 0; l < numLoops; l++) {
          const loopBaseAngle = (l / numLoops) * Math.PI * 2 + Math.sin(totalTime * 1.2 + l) * 0.4;
          const isErupting = (Math.floor(totalTime * 1.5 + l * 0.7) % numLoops === l);
          const maxLoopR = (isErupting ? 175.0 : 85.0 + Math.sin(totalTime * 5.0 + l) * 35.0) * (0.35 + 0.65 * holdIntensity);
          const loopSpanAngle = 0.55 + Math.sin(totalTime * 3.0 + l) * 0.2;

          for (let s = 0; s < nodesPerLoop; s++) {
            if (activeNodeCount >= MAX_NODES) break;
            const u = s / (nodesPerLoop - 1);
            const curR = 15.0 + Math.sin(u * Math.PI) * maxLoopR;
            const curA = loopBaseAngle + (u - 0.5) * loopSpanAngle;

            const nx = cX + Math.cos(curA) * curR;
            const ny = cY + Math.sin(curA) * curR;
            const nz = Math.sin(u * Math.PI * 2.0 + totalTime * 8.0) * 20.0 * holdIntensity;

            const col = isErupting ? { r: 1.0, g: 0.35, b: 0.85 } : SAKURA_HOLD_PALETTE[(l + s) % SAKURA_HOLD_PALETTE.length];
            const nIdx = activeNodeCount++;
            worldX[nIdx] = nx; worldY[nIdx] = ny; worldZ[nIdx] = nz;
            worldR[nIdx] = col.r; worldG[nIdx] = col.g; worldB[nIdx] = col.b;
            worldS[nIdx] = (isErupting ? 18.0 : 13.0) * (0.5 + 0.5 * holdIntensity);
            worldGrp[nIdx] = 999;
            worldAlpha[nIdx] = holdIntensity;
          }
        }
      } else if (currentSpawnStyle === 6) {
        // ==========================================
        // STIL 6: SAKURA BLOSSOM DRIFT (Organische Blütenblatt-Konstellation)
        // ==========================================
        const numPetals = 5;
        const nodesPerPetal = 10;
        for (let p = 0; p < numPetals; p++) {
          const petalBaseAngle = (p / numPetals) * Math.PI * 2 + totalTime * 0.65;
          const petalWobble = Math.sin(totalTime * 4.0 + p * 1.6) * 0.3;

          for (let n = 0; n < nodesPerPetal; n++) {
            if (activeNodeCount >= MAX_NODES) break;
            const u = n / (nodesPerPetal - 1);
            const r = (20.0 + u * 135.0) * (0.35 + 0.65 * holdIntensity);
            const lateral = Math.sin(u * Math.PI) * 45.0 * (1.0 + petalWobble);
            const a = petalBaseAngle + (lateral / Math.max(10.0, r));
            const flutter = Math.sin(totalTime * 6.0 + p * 1.5 + u * 3.0) * 25.0;

            const nx = cX + Math.cos(a) * r;
            const ny = cY + Math.sin(a) * r;
            const nz = flutter * holdIntensity;

            const col = SAKURA_HOLD_PALETTE[(p + n) % SAKURA_HOLD_PALETTE.length];
            const nIdx = activeNodeCount++;
            worldX[nIdx] = nx; worldY[nIdx] = ny; worldZ[nIdx] = nz;
            worldR[nIdx] = col.r; worldG[nIdx] = col.g; worldB[nIdx] = col.b;
            worldS[nIdx] = (12.0 + Math.sin(u * Math.PI) * 8.0) * (0.4 + 0.6 * holdIntensity);
            worldGrp[nIdx] = 999;
            worldAlpha[nIdx] = holdIntensity;
          }
        }
      }
    }

    // ==========================================
    // 7. NEW FEATURE 2: 2.0s DOCKING NETWORK IN ORB COLOR
    // ==========================================
    const activeDockingNetworks = [];

    class DockingNetworkInstance {
      constructor(orb) {
        this.orb = orb;
        this.age = 0.0;
        this.duration = 2.0; // 2.0 Sekunden flackern
        this.palette = SATURATED_PALETTES[orb.id] || SATURATED_PALETTES.pink;
        this.nodes = [];

        // 60-80 Dynamic nodes exploding and swirling around orb
        const count = 72;
        for (let i = 0; i < count; i++) {
          const phi = (i / count) * Math.PI * 2 * 3.0;
          const targetR = 40.0 + (i / count) * 135.0 + Math.random() * 25.0;
          this.nodes.push({
            angle: phi,
            spinSpeed: (i % 2 === 0 ? 1.0 : -1.0) * (1.2 + Math.random() * 1.6),
            targetR: targetR,
            curR: 10.0,
            relZ: (Math.random() - 0.5) * 45.0,
            color: this.palette[i % this.palette.length],
            strandPhase: Math.random() * Math.PI * 2
          });
        }
      }

      update(delta, totalTime) {
        this.age += delta;
        const progress = Math.min(1.0, this.age / this.duration);
        // Alpha curve: fast in (0.2s), hold, gentle fadeout
        const alpha = Math.min(1.0, this.age / 0.2) * Math.max(0.0, 1.0 - Math.pow(progress, 1.5));

        // Nodes expand and swirl
        this.nodes.forEach(n => {
          n.curR = THREE.MathUtils.lerp(n.curR, n.targetR, delta * 3.5);
          n.angle += n.spinSpeed * delta;
        });

        return progress < 1.0;
      }
    }

    // ==========================================
    // 8. PRE-FINALE FLOCKING FORMATION & INTERCONNECTED NETWORKS (Requirement 2)
    // ==========================================
    let isFinaleActive = false;
    let finaleStartTime = 0.0;
    const PLEXUS_FINALE_DURATION = 10.0;

    function checkPreFinaleProximity() {
      if (isFormationActive || isFinaleActive) return;
      if (totalAttachedPlexus < 6) return;

      const occupied = floatingOrbs.filter(o => o.attachedPlexusCount > 0);
      if (occupied.length < 2) return;

      // Berechne den Mittelpunkt (Centroid) aller belegten Orbs
      let cx = 0, cy = 0;
      occupied.forEach(o => { cx += o.x; cy += o.y; });
      cx /= occupied.length;
      cy /= occupied.length;

      // Wenn alle belegten Orbs zusammengeschoben wurden (< 135 Einheiten)
      const maxDistToCentroid = Math.max(...occupied.map(o => Math.hypot(o.x - cx, o.y - cy)));

      if (maxDistToCentroid < 135.0) {
        // Trigger Formation: Nicht übereinander, sondern über Netzwerke verbunden und synchron schwebend!
        isFormationActive = true;
        flockAngle = 0.0;
        bgUniforms.uRippleActive.value = 1.0;
        bgUniforms.uRippleTime.value = 0.0;
        promptBanner.className = 'prompt-banner finale';
        promptBanner.textContent = 'Orbs über Netzwerke verbunden — synchroner Schwebeflug!';
        showToastMsg('Netzwerk-Verbund aktiv: Orbs schweben synchron!');
      }
    }

    // ==========================================
    // 9. 10-SEKUNDEN FINALE ENGINE (DualSlider 1:1)
    // ==========================================
    class FinaleMeshParticle {
      constructor(palette, originPos, particleIndex) {
        this.originX = originPos.x + (Math.random() - 0.5) * 14.0;
        this.originY = originPos.y + (Math.random() - 0.5) * 14.0;
        this.originZ = (originPos.z || 0) + (Math.random() - 0.5) * 10.0;
        this.strandPhase = (particleIndex % 20) / 20.0;
        this.strandAmp = 42.0 + (particleIndex % 6) * 7.0;
        this.curlPhase = (particleIndex * 1.45) % (Math.PI * 2);
        this.curlSpeed = 1.2 + (particleIndex % 3) * 0.32;

        const angle = Math.random() * Math.PI * 2;
        const rFrac = Math.sqrt(Math.random());
        this.x = Math.cos(angle) * 165.0 * 0.90 * rFrac;
        this.y = Math.sin(angle) * 135.0 * 0.90 * rFrac;
        this.z = (Math.random() - 0.5) * 2.0 * 48.0;

        this.renderX = this.originX;
        this.renderY = this.originY;
        this.renderZ = this.originZ;

        this.speed = 0.8 + Math.random() * 0.4;
        const dir = Math.random() * Math.PI * 2;
        const pitch = (Math.random() - 0.5) * Math.PI * 0.7;
        this.vx = Math.cos(dir) * Math.cos(pitch) * this.speed;
        this.vy = Math.sin(dir) * Math.cos(pitch) * this.speed;
        this.vz = Math.sin(pitch) * this.speed * 0.6;

        this.radius = 8 + Math.random() * 6;
        this.color = palette ? palette[Math.floor(Math.random() * palette.length)] : { r: 1, g: 0.8, b: 0.9 };
      }

      update(delta, transitionProgress, finaleAge, totalTime) {
        this.x += this.vx * delta * 60.0;
        this.y += this.vy * delta * 60.0;
        this.z += this.vz * delta * 60.0;

        let particleProg = 1.0;
        let easeProg = 1.0;
        let waveX = 0, waveY = 0, waveZ = 0;

        if (transitionProgress < 1.0) {
          const strandStart = this.strandPhase * 0.38;
          particleProg = Math.max(0.0, Math.min(1.0, (transitionProgress - strandStart) / (1.0 - strandStart)));
          easeProg = particleProg * particleProg * (3.0 - 2.0 * particleProg);

          const env = Math.sin(particleProg * Math.PI);
          waveX = Math.sin(totalTime * this.curlSpeed + this.curlPhase + particleProg * 6.28) * this.strandAmp * env;
          waveY = Math.cos(totalTime * (this.curlSpeed * 0.85) + this.curlPhase * 1.3 + particleProg * 5.5) * (this.strandAmp * 0.8) * env;
          waveZ = Math.sin(totalTime * (this.curlSpeed * 1.2) + this.curlPhase * 2.1 + particleProg * 7.0) * (this.strandAmp * 0.6) * env;
        }

        this.renderX = THREE.MathUtils.lerp(this.originX, this.x, easeProg) + waveX;
        this.renderY = THREE.MathUtils.lerp(this.originY, this.y, easeProg) + waveY;
        this.renderZ = THREE.MathUtils.lerp(this.originZ, this.z, easeProg) + waveZ;
      }
    }

    const activeImpulses = [];
    const FINALE_WINDOWS = [
      { startSeek: 0.1, triggerAt: 1.0, endAt: 2.3 },
      { startSeek: 3.6, triggerAt: 4.9, endAt: 6.2 },
      { startSeek: 7.4, triggerAt: 8.7, endAt: 10.0 }
    ];

    function startPlexusFinale() {
      if (isFinaleActive) return;
      isFinaleActive = true;
      isFormationActive = false;
      finaleStartTime = performance.now() * 0.001;
      activeImpulses.length = 0;
      floatingOrbs.forEach(o => { o.finaleNetworkCount = 0; o.inImpulse = false; });
      bgUniforms.uRippleActive.value = 1.0;
      bgUniforms.uRippleTime.value = 0.0;
      promptBanner.className = 'prompt-banner finale';
      promptBanner.textContent = '10s Finale aktiv: Synaptisches Netzwerk entfaltet sich!';
      showToastMsg('10s Finale gestartet!');
    }

    // ==========================================
    // 10. POINTER & INTERACTION HANDLING
    // ==========================================
    function updatePointerWorld(cx, cy) {
      const normX = (cx / window.innerWidth) * 2 - 1;
      const normY = -(cy / window.innerHeight) * 2 + 1;
      const vector = new THREE.Vector3(normX, normY, 0.5);
      vector.unproject(camera);
      const dir = vector.sub(camera.position).normalize();
      const distance = -camera.position.z / dir.z;
      const pos = camera.position.clone().add(dir.multiplyScalar(distance));
      mouseWorld.set(pos.x, pos.y, 0);
    }

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.bottom-bar') || e.target.closest('.top-header') || e.target.closest('.spawn-style-bar')) return;
      isMouseDown = true;
      isHoldCharging = false;
      updatePointerWorld(e.clientX, e.clientY);

      // Check if clicking an Orb (in Pre-Finale)
      if (totalAttachedPlexus >= 6 && !isFinaleActive && !isFormationActive) {
        for (let o of floatingOrbs) {
          if (Math.hypot(o.x - mouseWorld.x, o.y - mouseWorld.y) < 45.0) {
            draggedOrb = o;
            draggedOrb.isDragged = true;
            draggedOrb.triggerHoverWobble();
            holdCircle.style.opacity = '0';
            return;
          }
        }
      }

      // Check if clicking a free cluster
      for (let c of activeClusters) {
        if (Math.hypot(c.x - mouseWorld.x, c.y - mouseWorld.y) < 55.0) {
          draggedCluster = c;
          holdCircle.style.opacity = '0';
          return;
        }
      }

      // If neither an orb nor a cluster, start hold-creation charging on empty space
      isHoldCharging = true;
      holdTimer = 0.0;
      holdOrigin.x = mouseWorld.x;
      holdOrigin.y = mouseWorld.y;

      // Position SVG ring
      holdCircle.setAttribute('cx', e.clientX);
      holdCircle.setAttribute('cy', e.clientY);
      holdCircle.style.opacity = '1';
    });

    window.addEventListener('pointermove', (e) => {
      updatePointerWorld(e.clientX, e.clientY);

      if (draggedOrb) {
        draggedOrb.x = mouseWorld.x;
        draggedOrb.y = mouseWorld.y;
        draggedOrb.restX = mouseWorld.x;
        draggedOrb.restY = mouseWorld.y;
        checkPreFinaleProximity();
      } else if (draggedCluster) {
        draggedCluster.x = mouseWorld.x;
        draggedCluster.y = mouseWorld.y;
        floatingOrbs.forEach(orb => {
          if (Math.hypot(orb.x - draggedCluster.x, orb.y - draggedCluster.y) < 80) {
            orb.triggerHoverWobble();
          }
        });
      } else if (isHoldCharging) {
        holdCircle.setAttribute('cx', e.clientX);
        holdCircle.setAttribute('cy', e.clientY);
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (draggedOrb) {
        draggedOrb.isDragged = false;
        draggedOrb.hasBeenPlaced = true;
        draggedOrb = null;
        checkPreFinaleProximity();
      } else if (draggedCluster) {
        // Check if dropped onto an Orb (< 120px)
        let closest = null, minDist = 120.0;
        floatingOrbs.forEach(orb => {
          const d = Math.hypot(orb.x - draggedCluster.x, orb.y - draggedCluster.y);
          if (d < minDist) { minDist = d; closest = orb; }
        });

        if (closest) {
          closest.attachCluster(draggedCluster);
          closest.triggerDockWobble();
          totalAttachedPlexus++;

          // NEW FEATURE: Trigger 2.0s Flickering Docking Network in orb color!
          activeDockingNetworks.push(new DockingNetworkInstance(closest));

          const idx = activeClusters.indexOf(draggedCluster);
          if (idx !== -1) activeClusters.splice(idx, 1);

          showToastMsg(`Plexus an ${closest.name}-Orb angedockt! (${totalAttachedPlexus}/6)`);

          if (totalAttachedPlexus >= 6) {
            promptBanner.className = 'prompt-banner sakura';
            promptBanner.textContent = '6 Plexus angedockt! Schiebe alle belegten Orbs zusammen!';
          }
        }
        draggedCluster = null;
      } else if (isHoldCharging && !draggedCluster && !draggedOrb && holdTimer >= HOLD_THRESHOLD) {
        // Cluster successfully spawned ONLY when charging on empty space completed
        activeClusters.push(new DriftingCluster(holdOrigin.x, holdOrigin.y));
        showToastMsg('Neuer Plexus aus dem Sakura-Netzwerk erschaffen!');
      }

      isMouseDown = false;
      isHoldCharging = false;
      holdTimer = 0.0;
      holdCircle.style.opacity = '0';
      holdCircle.setAttribute('stroke-dashoffset', '201');
    });

    document.getElementById('btn-reset').addEventListener('click', () => {

        o.homeX = cfg.homeX;
        o.homeY = cfg.homeY;
        o.attachedPlexusCount = 0;
        o.attachedNodes = [];
        o.hasBeenPlaced = false;
        o.finaleVx = 0;
        o.finaleVy = 0;
      });
      bgUniforms.uBgDim.value = 1.0;
      bgUniforms.uRippleActive.value = 0.0;
      promptBanner.className = 'prompt-banner';
      promptBanner.textContent = 'Halte gedrückt (1.5s), um ein stark flackerndes Sakura-Netzwerk zu erschaffen!';
      showToastMsg('Szene zurückgesetzt.');
    });

    // Spawn-Modus UI Listener (Requirement 1)
    const stylePills = document.querySelectorAll('.style-pill[data-style]');
    stylePills.forEach(pill => {
      pill.addEventListener('click', () => {
        stylePills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentSpawnStyle = parseInt(pill.dataset.style, 10);
        const styleNames = [
          '1. Electric Arcs',
          '2. Chaotic Vortex',
          '3. Neural Synapse',
          '4. Quantum Glitch',
          '5. Solar Flare',
          '6. Sakura Drift'
        ];
        showToastMsg(`Spawn-Stil ${currentSpawnStyle}: ${styleNames[currentSpawnStyle - 1]}`);
      });
    });

    const btnToggleContinuous = document.getElementById('btn-toggle-continuous');
    if (btnToggleContinuous) {
      btnToggleContinuous.addEventListener('click', () => {
        isContinuousTestActive = !isContinuousTestActive;
        if (isContinuousTestActive) {
          btnToggleContinuous.classList.add('active');
          btnToggleContinuous.textContent = 'Dauertest: AN';
          showToastMsg('Dauertest AN: Unregelmäßige Struktur aktiv!');
        } else {
          btnToggleContinuous.classList.remove('active');
          btnToggleContinuous.textContent = 'Dauertest: AUS';
          showToastMsg('Dauertest AUS.');
        }
      });
    }

    // ==========================================
    // 12. MAIN RENDER LOOP
    // ==========================================
    let lastTime = performance.now();
    let frameCounter = 0;
    let fps = 60;
    let lastFpsUpdate = performance.now();

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const delta = Math.min(0.1, (now - lastTime) * 0.001);
      const totalTime = now * 0.001;
      lastTime = now;

      // FPS Counter
      frameCounter++;
      if (now - lastFpsUpdate > 500) {
        fps = Math.round((frameCounter * 1000) / (now - lastFpsUpdate));
        frameCounter = 0;
        lastFpsUpdate = now;
      }

      // Background update
      bgUniforms.uTime.value = totalTime;
      if (bgUniforms.uRippleActive.value > 0.5) {
        bgUniforms.uRippleTime.value += delta;
        if (bgUniforms.uRippleTime.value >= 2.5) {
          bgUniforms.uRippleActive.value = 0.0;
        }
      }

      const targetDim = isFinaleActive ? 0.45 : 1.0;
      bgUniforms.uBgDim.value = THREE.MathUtils.lerp(bgUniforms.uBgDim.value, targetDim, delta * 2.0);

      // Flocking Formation Drift
      if (isFormationActive) {
        flockAngle += delta * 0.45;
        flockCenterX = Math.sin(flockAngle) * 75.0 + Math.sin(flockAngle * 2.1) * 22.0;
        flockCenterY = Math.cos(flockAngle * 0.75) * 45.0 + Math.cos(flockAngle * 1.8) * 16.0;
      }

      // Finale 10s Timer
      const finaleAge = isFinaleActive ? (totalTime - finaleStartTime) : 0.0;
      if (isFinaleActive && finaleAge >= PLEXUS_FINALE_DURATION) {
        isFinaleActive = false;
        promptBanner.className = 'prompt-banner';
        promptBanner.textContent = 'Plexus-Netzwerk nach 10s vollendet!';
        showToastMsg('10s Finale abgeschlossen! Souvenir erzeugt.');
      }

      // Update Orbs
      floatingOrbs.forEach(orb => {
        orb.update(delta, totalTime, isFinaleActive, finaleAge);
      });

      // Update Free Drifting Clusters
      activeClusters.forEach(c => {
        if (c !== draggedCluster) c.update(delta);
      });

      // ==========================================
      // POPULATE SCENE NODES FOR GPU RENDERING
      // ==========================================
      activeNodeCount = 0;

      // 1. Hold-Down or Continuous Test Sakura Network (6 Spawn Styles - Requirement 1)
      const isHoldActive = (isHoldCharging && !draggedCluster && !draggedOrb && holdTimer < HOLD_THRESHOLD);
      if (isHoldActive || isContinuousTestActive) {
        if (isHoldActive) {
          holdTimer += delta;
          const holdProgress = Math.min(1.0, holdTimer / HOLD_THRESHOLD);
          holdCircle.setAttribute('stroke-dashoffset', `${201 * (1.0 - holdProgress)}`);
        }

        const effectiveProgress = isContinuousTestActive ? 1.0 : Math.min(1.0, holdTimer / HOLD_THRESHOLD);
        const holdIntensity = Math.pow(effectiveProgress, 0.72);
        const originX = isContinuousTestActive ? 0.0 : holdOrigin.x;
        const originY = isContinuousTestActive ? 0.0 : holdOrigin.y;

        populateHoldNetwork(delta, totalTime, holdIntensity, originX, originY);
      }

      // 1b. Attached Plexus Satellites orbiting Orbs (Requirement 3)
      floatingOrbs.forEach(orb => {
        if (orb.attachedNodes.length === 0) return;
        const orbGrp = 500 + orb.orbIndex;

        // Central anchor hub for lines to connect into orb core
        if (activeNodeCount < MAX_NODES) {
          const hubIdx = activeNodeCount++;
          worldX[hubIdx] = orb.x;
          worldY[hubIdx] = orb.y;
          worldZ[hubIdx] = orb.z;
          const pal = SATURATED_PALETTES[orb.id] || SATURATED_PALETTES.pink;
          worldR[hubIdx] = pal[0].r;
          worldG[hubIdx] = pal[0].g;
          worldB[hubIdx] = pal[0].b;
          worldS[hubIdx] = 22.0;
          worldGrp[hubIdx] = orbGrp;
          worldAlpha[hubIdx] = 1.0;
        }

        // Orbiting satellite nodes
        orb.attachedNodes.forEach(an => {
          if (activeNodeCount >= MAX_NODES) return;
          const localX = orb.x + Math.cos(an.angle) * Math.cos(an.elevation) * an.radius;
          const localY = orb.y + Math.sin(an.angle) * Math.cos(an.elevation) * an.radius * 0.85;
          const localZ = orb.z + Math.sin(an.elevation) * an.radius;

          const nIdx = activeNodeCount++;
          worldX[nIdx] = localX;
          worldY[nIdx] = localY;
          worldZ[nIdx] = localZ;
          worldR[nIdx] = an.r;
          worldG[nIdx] = an.g;
          worldB[nIdx] = an.b;
          worldS[nIdx] = an.size;
          worldGrp[nIdx] = orbGrp;
          worldAlpha[nIdx] = 1.0;
        });
      });

      // 2. Active 2.0s Docking Networks in Orb Colors (NEW FEATURE 2)
      for (let i = activeDockingNetworks.length - 1; i >= 0; i--) {
        const dn = activeDockingNetworks[i];
        const alive = dn.update(delta, totalTime);
        const alpha = Math.min(1.0, dn.age / 0.2) * Math.max(0.0, 1.0 - Math.pow(dn.age / dn.duration, 1.5));

        for (let k = 0; k < dn.nodes.length; k++) {
          if (activeNodeCount >= MAX_NODES) break;
          const dnNode = dn.nodes[k];
          const nx = dn.orb.x + Math.cos(dnNode.angle) * dnNode.curR;
          const ny = dn.orb.y + Math.sin(dnNode.angle) * dnNode.curR;
          const nz = dn.orb.z + dnNode.relZ;

          const nIdx = activeNodeCount++;
          worldX[nIdx] = nx;
          worldY[nIdx] = ny;
          worldZ[nIdx] = nz;
          worldR[nIdx] = dnNode.color.r;
          worldG[nIdx] = dnNode.color.g;
          worldB[nIdx] = dnNode.color.b;
          worldS[nIdx] = 18.0 * alpha;
          worldGrp[nIdx] = 800 + i; // Dedicated group so docking lines connect with each other
          worldAlpha[nIdx] = alpha;
        }

        if (!alive) {
          activeDockingNetworks.splice(i, 1);
        }
      }

      // 3. Free Drifting Clusters
      activeClusters.forEach((cl, cIdx) => {
        cl.nodes.forEach(nd => {
          if (activeNodeCount >= MAX_NODES) return;
          const nIdx = activeNodeCount++;
          worldX[nIdx] = cl.x + nd.relX;
          worldY[nIdx] = cl.y + nd.relY;
          worldZ[nIdx] = cl.z + nd.relZ;
          worldR[nIdx] = nd.color.r;
          worldG[nIdx] = nd.color.g;
          worldB[nIdx] = nd.color.b;
          worldS[nIdx] = 16.0;
          worldGrp[nIdx] = 700 + cIdx;
          worldAlpha[nIdx] = 1.0;
        });
      });

      // 4. 10s Finale Encounter Logic & Particles
      if (isFinaleActive) {
        const activeDockedOrbs = floatingOrbs.filter(o => o.attachedPlexusCount > 0);

        for (let r = 0; r < FINALE_WINDOWS.length; r++) {
          const win = FINALE_WINDOWS[r];
          if (finaleAge >= win.startSeek && finaleAge < win.endAt) {
            const roundPairs = [];
            if (activeDockedOrbs.length === 2) {
              roundPairs.push([activeDockedOrbs[0], activeDockedOrbs[1]]);
            } else if (activeDockedOrbs.length === 3) {
              if (r === 0) roundPairs.push([activeDockedOrbs[0], activeDockedOrbs[1]]);
              else if (r === 1) roundPairs.push([activeDockedOrbs[1], activeDockedOrbs[2]]);
              else if (r === 2) roundPairs.push([activeDockedOrbs[0], activeDockedOrbs[2]]);
            } else if (activeDockedOrbs.length >= 4) {
              if (r === 0) roundPairs.push([activeDockedOrbs[0], activeDockedOrbs[1]], [activeDockedOrbs[2], activeDockedOrbs[3]]);
              else if (r === 1) roundPairs.push([activeDockedOrbs[0], activeDockedOrbs[2]], [activeDockedOrbs[1], activeDockedOrbs[3]]);
              else if (r === 2) roundPairs.push([activeDockedOrbs[0], activeDockedOrbs[3]], [activeDockedOrbs[1], activeDockedOrbs[2]]);
            }

            roundPairs.forEach(([orbA, orbB]) => {
              if (!orbA || !orbB) return;
              const alreadyIn = activeImpulses.some(imp => imp.orbA === orbA || imp.orbB === orbA || imp.orbA === orbB || imp.orbB === orbB);
              const doneRound = (orbA.finaleNetworkCount > r) && (orbB.finaleNetworkCount > r);

              if (!alreadyIn && !doneRound && orbA.impulseCooldown <= 0 && orbB.impulseCooldown <= 0) {
                const dx = orbB.x - orbA.x;
                const dy = orbB.y - orbA.y;
                const dist = Math.hypot(dx, dy) || 1.0;
                const nx = dx / dist;
                const ny = dy / dist;

                if (finaleAge < win.triggerAt) {
                  // Mutual Attraction
                  const pull = Math.min(260.0, 550.0 / Math.max(20.0, dist));
                  orbA.finaleVx += nx * pull * delta * 3.6;
                  orbA.finaleVy += ny * pull * delta * 3.6;
                  orbB.finaleVx -= nx * pull * delta * 3.6;
                  orbB.finaleVy -= ny * pull * delta * 3.6;
                } else {
                  // Window Trigger Encounter
                  orbA.triggerDockWobble();
                  orbB.triggerDockWobble();

                  const midX = (orbA.x + orbB.x) * 0.5;
                  const midY = (orbA.y + orbB.y) * 0.5;
                  const initialAngle = Math.atan2(orbA.y - midY, orbA.x - midX);
                  const initialDistA = Math.hypot(orbA.x - midX, orbA.y - midY);
                  const initialDistB = Math.hypot(orbB.x - midX, orbB.y - midY);

                  const palA = SATURATED_PALETTES[orbA.id];
                  const palB = SATURATED_PALETTES[orbB.id];
                  const particles = [];

                  for (let p = 0; p < 80; p++) {
                    const useA = (p % 2 === 0);
                    const srcOrb = useA ? orbA : orbB;
                    const pal = useA ? palA : palB;
                    particles.push(new FinaleMeshParticle(pal, { x: srcOrb.x - midX, y: srcOrb.y - midY, z: srcOrb.z }, p));
                  }

                  const duration = Math.max(0.1, win.endAt - finaleAge);
                  activeImpulses.push({
                    orbA, orbB, age: 0.0, remaining: duration, duration,
                    midX, midY, initialAngle, initialDistA, initialDistB,
                    particles, roundIdx: r
                  });

                  orbA.inImpulse = true;
                  orbB.inImpulse = true;
                  orbA.finaleNetworkCount++;
                  orbB.finaleNetworkCount++;
                }
              }
            });
          }
        }

        // Update Active Finale Impulses
        for (let impIdx = activeImpulses.length - 1; impIdx >= 0; impIdx--) {
          const imp = activeImpulses[impIdx];
          imp.age += delta;
          imp.remaining -= delta;

          const transitionProgress = Math.min(1.0, imp.age / 0.65);
          const impAlpha = Math.min(1.0, Math.min(imp.age / 0.40, Math.max(0.0, imp.remaining / 0.30)));
          const entryProg = Math.min(1.0, imp.age / 0.60);
          const smoothEase = entryProg * entryProg * (3.0 - 2.0 * entryProg);
          const targetOrbitR = 26.0;
          const curDistA = THREE.MathUtils.lerp(imp.initialDistA, targetOrbitR, smoothEase);
          const curDistB = THREE.MathUtils.lerp(imp.initialDistB, targetOrbitR, smoothEase);
          const orbitAngle = imp.initialAngle + imp.age * 1.7;

          imp.orbA.x = imp.midX + Math.cos(orbitAngle) * curDistA;
          imp.orbA.y = imp.midY + Math.sin(orbitAngle) * curDistA * 0.85;
          imp.orbB.x = imp.midX - Math.cos(orbitAngle) * curDistB;
          imp.orbB.y = imp.midY - Math.sin(orbitAngle) * curDistB * 0.85;

          // Push particles into GPU buffer
          for (let p = 0; p < imp.particles.length; p++) {
            if (activeNodeCount >= MAX_NODES) break;
            const pt = imp.particles[p];
            pt.update(delta, transitionProgress, imp.age, totalTime);

            const nIdx = activeNodeCount++;
            worldX[nIdx] = pt.renderX;
            worldY[nIdx] = pt.renderY;
            worldZ[nIdx] = pt.renderZ;
            worldR[nIdx] = pt.color.r;
            worldG[nIdx] = pt.color.g;
            worldB[nIdx] = pt.color.b;
            worldS[nIdx] = pt.radius * (0.25 + 0.75 * impAlpha);
            worldGrp[nIdx] = -(impIdx + 1);
            worldAlpha[nIdx] = impAlpha;
          }

          if (imp.remaining <= 0) {
            const dx = imp.orbB.x - imp.orbA.x;
            const dy = imp.orbB.y - imp.orbA.y;
            const d = Math.hypot(dx, dy) || 1.0;
            const sep = 175.0;
            imp.orbA.finaleVx = -(dx / d) * sep;
            imp.orbA.finaleVy = -(dy / d) * sep;
            imp.orbB.finaleVx = (dx / d) * sep;
            imp.orbB.finaleVy = (dy / d) * sep;
            imp.orbA.inImpulse = false;
            imp.orbB.inImpulse = false;
            imp.orbA.impulseCooldown = 0.5;
            imp.orbB.impulseCooldown = 0.5;
            activeImpulses.splice(impIdx, 1);
          }
        }
      }

      // ==========================================
      // POPULATE GPU BUFFERS (POINTS & FLICKERING LINES)
      // ==========================================
      for (let k = 0; k < activeNodeCount; k++) {
        const k3 = k * 3;
        nodePos[k3] = worldX[k];
        nodePos[k3 + 1] = worldY[k];
        nodePos[k3 + 2] = worldZ[k];

        const a = worldAlpha[k] || 1.0;
        nodeCol[k3] = worldR[k] * a;
        nodeCol[k3 + 1] = worldG[k] * a;
        nodeCol[k3 + 2] = worldB[k] * a;
        nodeSize[k] = worldS[k];
      }
      nodeGeo.attributes.position.needsUpdate = true;
      nodeGeo.attributes.color.needsUpdate = true;
      nodeGeo.attributes.size.needsUpdate = true;
      nodeGeo.setDrawRange(0, activeNodeCount);

      // Flickering Line Generation (DualSlider 1:1)
      let lineVertIdx = 0;
      let lineColIdx = 0;
      const maxLineVerts = linePos.length - 18;
      const nodeLinks = new Uint8Array(activeNodeCount);

      for (let i = 0; i < activeNodeCount; i++) {
        if (nodeLinks[i] >= 4) continue;
        const x1 = worldX[i], y1 = worldY[i], z1 = worldZ[i];
        const grp1 = worldGrp[i];
        const r1 = worldR[i], g1 = worldG[i], b1 = worldB[i];
        const a1 = worldAlpha[i] || 1.0;

        for (let j = i + 1; j < activeNodeCount; j++) {
          if (lineVertIdx >= maxLineVerts) break;
          if (nodeLinks[i] >= 4) break;
          if (nodeLinks[j] >= 4) continue;

          const grp2 = worldGrp[j];
          let canConnect = (grp2 === grp1);
          let isInterOrbBridge = false;

          // INTER-ORB BRIDGE LINES: When orbs are in formation or docked in proximity (Requirement 2)
          if (!canConnect && grp1 >= 500 && grp1 < 600 && grp2 >= 500 && grp2 < 600) {
            canConnect = true;
            isInterOrbBridge = true;
          }

          if (!canConnect) continue;

          const dx = worldX[j] - x1;
          const dy = worldY[j] - y1;
          const dz = worldZ[j] - z1;
          const distSq = dx * dx + dy * dy + dz * dz;

          let cutoff = 88.0;
          if (isInterOrbBridge) {
            cutoff = 120.0; // Inter-orb connecting bridge filaments
          } else if (grp1 === 999) {
            if (currentSpawnStyle === 1) cutoff = 78.0;
            else if (currentSpawnStyle === 2) cutoff = 72.0;
            else if (currentSpawnStyle === 3) cutoff = 84.0;
            else if (currentSpawnStyle === 4) cutoff = 68.0;
            else if (currentSpawnStyle === 5) cutoff = 76.0;
            else if (currentSpawnStyle === 6) cutoff = 72.0;
          } else if (grp1 >= 500 && grp1 < 600) {
            cutoff = 68.0; // Orb attached satellite shells
          } else if (grp1 >= 800 && grp1 < 900) {
            cutoff = 95.0; // Docking network burst
          }

          if (distSq < cutoff * cutoff) {
            const distance = Math.sqrt(distSq);
            const opacity = 1.0 - distance / cutoff;
            if (opacity > 0.01) {
              // DualSlider 1:1 High-Frequency Flicker
              const seed = (i * 137.5 + j * 269.3) % 1000.0;
              const fA = Math.sin(totalTime * 14.0 + seed);
              const fB = Math.cos(totalTime * 25.0 + seed * 1.7);
              const fNoise = fA * 0.6 + fB * 0.4;

              let fMul = 1.0;
              if (fNoise < -0.32) {
                fMul = (fNoise + 0.32) * -3.0 > 0.4 ? 0.0 : 0.35;
              } else if (fNoise > 0.68) {
                fMul = 1.75; // Sharp bright filament burst!
              }
              if (fMul <= 0.02) continue;

              nodeLinks[i]++;
              nodeLinks[j]++;

              const lAlpha = Math.min(1.0, Math.pow(opacity, isInterOrbBridge ? 0.45 : 0.55) * 1.35 * fMul) * a1;
              const r2 = worldR[j], g2 = worldG[j], b2 = worldB[j];

              // Vertex 1
              linePos[lineVertIdx++] = x1;
              linePos[lineVertIdx++] = y1;
              linePos[lineVertIdx++] = z1;
              lineCol[lineColIdx++] = r1 * lAlpha;
              lineCol[lineColIdx++] = g1 * lAlpha;
              lineCol[lineColIdx++] = b1 * lAlpha;

              // Vertex 2
              linePos[lineVertIdx++] = worldX[j];
              linePos[lineVertIdx++] = worldY[j];
              linePos[lineVertIdx++] = worldZ[j];
              lineCol[lineColIdx++] = r2 * lAlpha;
              lineCol[lineColIdx++] = g2 * lAlpha;
              lineCol[lineColIdx++] = b2 * lAlpha;
            }
          }
        }
      }

      lineGeo.attributes.position.needsUpdate = true;
      lineGeo.attributes.color.needsUpdate = true;
      lineGeo.setDrawRange(0, lineVertIdx / 3);

      // Render Passes: 1. Background, 2. Main 3D Scene
      renderer.autoClear = false;
      renderer.clear();
      renderer.render(bgScene, bgCam);
      renderer.clearDepth();
      renderer.render(scene, camera);

      // Telemetry update
      let stateLabel = 'IDLE';
      if (isFinaleActive) stateLabel = `FINALE (${finaleAge.toFixed(1)}s)`;
      else if (isFormationActive) stateLabel = 'FORMATION (SCHWEBEND)';
      else if (isContinuousTestActive) stateLabel = `DAUERTEST STIL ${currentSpawnStyle}`;
      else if (isHoldCharging) stateLabel = `HOLD (${holdTimer.toFixed(1)}s)`;
      else if (draggedCluster) stateLabel = 'DRAGGING PLEXUS';
      else if (draggedOrb) stateLabel = 'DRAGGING ORB';
      else if (activeDockingNetworks.length > 0) stateLabel = 'DOCK-NET ACTIVE';

      telemetry.textContent = `DOCK: ${totalAttachedPlexus}/6 · FPS: ${fps} · ${stateLabel}`;
    }

    animate();

    // Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      bgUniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
    });

  </script>
</body>
